<text x="65" y="103" fill="#f8fafc" font-size="34" font-weight="700">Recrutamento e Seleção · ATS</text>
<text x="65" y="138" fill="#cbd5e1" font-size="18">Vagas, candidatos e etapas do processo seletivo em uma aplicação web</text><rect x="40" y="180" width="340" height="174" rx="14" fill="#1e293b" stroke="#334155"/><text x="64" y="212" fill="#a78bfa" font-size="13" font-weight="700">01 · ORGANIZAR</text><text x="64" y="250" fill="#f8fafc" font-size="23" font-weight="600">Interface React</text><text x="64" y="289" fill="#cbd5e1" font-size="17">Vagas e candidatos</text><text x="64" y="317" fill="#cbd5e1" font-size="17">Fila de parecer e relatórios</text><path d="M 390 267 h 27 m -7 -7 l 7 7 -7 7" stroke="#a78bfa" stroke-width="2" fill="none"/><rect x="430" y="180" width="340" height="174" rx="14" fill="#1e293b" stroke="#334155"/><text x="454" y="212" fill="#a78bfa" font-size="13" font-weight="700">02 · PROCESSAR</text><text x="454" y="250" fill="#f8fafc" font-size="23" font-weight="600">API FastAPI</text><text x="454" y="289" fill="#cbd5e1" font-size="17">Autenticação JWT e perfis</text><text x="454" y="317" fill="#cbd5e1" font-size="17">Validação e eventos SSE</text><path d="M 780 267 h 27 m -7 -7 l 7 7 -7 7" stroke="#a78bfa" stroke-width="2" fill="none"/><rect x="820" y="180" width="340" height="174" rx="14" fill="#1e293b" stroke="#334155"/><text x="844" y="212" fill="#a78bfa" font-size="13" font-weight="700">03 · PERSISTIR</text><text x="844" y="250" fill="#f8fafc" font-size="23" font-weight="600">SQLAlchemy</text><text x="844" y="289" fill="#cbd5e1" font-size="17">SQLite ou PostgreSQL</text><text x="844" y="317" fill="#cbd5e1" font-size="17">Migrações com Alembic</text><text x="40" y="399" fill="#a78bfa" font-size="15" letter-spacing="1">PYTHON   /   REACT   /   FASTAPI   /   POSTGRESQL</text><text x="40" y="432" fill="#94a3b8" font-size="13">DIAGRAMA FUNCIONAL · Baseado nos componentes presentes no código</text></g></svg>
