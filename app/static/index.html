<script>
window.addEventListener("unhandledrejection", function(ev){
  try{
    var m = (ev.reason && (ev.reason.message || ev.reason)) || "";
    if(!m) return;
    if(window.avisar) window.avisar.erro("Algo falhou: " + m);
    else console.error("[ATS]", m);
  }catch(e){}
});

(function(){
  function faltando(){
    var f=[];
    if(typeof React==="undefined") f.push("React");
    if(typeof ReactDOM==="undefined") f.push("ReactDOM");
    if(typeof Babel==="undefined") f.push("Babel");
    return f;
  }
  window.addEventListener("load", function(){
    setTimeout(function(){
      var raiz=document.getElementById("root");
      if(raiz && raiz.children.length) return;
      var f=faltando();
      var causa = f.length
        ? "Nao foi possivel carregar: <b>"+f.join(", ")+"</b>."
        : "As bibliotecas carregaram, mas a tela nao desenhou. Provavelmente ha um erro no codigo.";
      var dica = f.length
        ? "<li>Rode o <b>baixar_bibliotecas.bat</b> uma vez, num computador com internet. Depois disso o sistema nao depende mais de sites externos.</li>"
          +"<li>Se ja rodou, confira se existe a pasta <b>app/static/vendor</b> com 5 arquivos .js dentro.</li>"
          +"<li>Enquanto isso, o sistema tenta a internet: a rede da empresa pode estar bloqueando <b>unpkg.com</b>.</li>"
        : "<li>Aperte F12, abra a aba <b>Console</b> e mande o erro em vermelho para o TI.</li>";
      raiz.innerHTML =
        '<div style="max-width:640px;margin:12vh auto;padding:28px;font-family:system-ui,sans-serif;'
        +'background:#fff;border:1px solid #eae7e2;border-radius:16px;box-shadow:0 8px 30px -12px rgba(28,25,23,.18)">'
        +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'
        +'<div style="width:40px;height:40px;border-radius:12px;background:#fef2f2;color:#dc2626;display:flex;'
        +'align-items:center;justify-content:center;font-weight:700;font-size:20px">!</div>'
        +'<div><div style="font-size:18px;font-weight:700;color:#1c1917">O sistema nao conseguiu abrir</div>'
        +'<div style="font-size:13px;color:#a8a29e">Seus dados estao a salvo no servidor</div></div></div>'
        +'<p style="font-size:14px;color:#57534e;line-height:1.6;margin:0 0 12px">'+causa+'</p>'
        +'<ul style="font-size:13.5px;color:#57534e;line-height:1.75;margin:0 0 18px;padding-left:20px">'+dica+'</ul>'
        +'<button onclick="location.reload()" style="background:#1c1917;color:#fff;border:0;padding:9px 16px;'
        +'border-radius:9px;font-weight:600;font-size:13.5px;cursor:pointer">Tentar de novo</button></div>';
    }, 3500);
  });
})();
</script>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;
const API = "";
const VERSAO_TELA = "2026.08.03.5";

const STATUS_CAND = ["APROVADO","REPROVADO","DECLINOU","DESISTIU","SEM RETORNO","CANCELADO"];
const STATUS_ANDAMENTO = ["TRIADO","RH","GESTÃO","CONGELADA","FECHADA"];
const STATUS_TODOS = [...STATUS_ANDAMENTO, ...STATUS_CAND];
const ORIGENS = ["Indeed","LinkedIn","E-mail","Indicação","WhatsApp","RHI","Jobbol","OLX","Presencial","EmpregaPalhoça"];
const TIPOS = ["CLT","PJ","CLT/PJ","Estágio","Temporário"];
const MOTIVOS = ["AMPLIAÇÃO","SUBSTITUIÇÃO"];
const NIVEIS = ["Júnior","Pleno","Sênior","Júnior/Pleno","Pleno/Sênior","Júnior/Pleno/Sênior"];
const CARGOS = ["Analista COMEX","Analista de Marketing","Analista de TI","Assistente ADM Comercial",
  "Assistente de RH","Auxiliar de Compras","Auxiliar de Mecânico","BDR","Coordenador de Produto COMEX",
  "Executivo COMEX","Gerente de Marketing","Mecânico","SDR","Social Media","Supervisor Comercial",
  "Supervisor SDR","Técnico de Atendimento","Vendedor","Vendedor Externo"];
const STATUS_VAGA = ["ABERTURA","DIVULGAÇÃO","PERFIL","SELEÇÃO","CONGELADA","FECHADA"];
const ETAPAS = ["1. Recebido","2. Triado","3. Entrevista RH","4. Entrevista Gestão","5. Congelado","6. Aprovado","0. Encerrado"];
const PERFIS = ["TI","RH","GESTOR","DIRETORIA"];
const LINHAS = ["Linha Amarela","Linha Movimentação","Ambas"];
const RETOMAR_RX = /(retomar|boa op|banco|futuro|talento)/i;
const OKNAO = ["ok","não"];
const REAGENDADO = ["Não","Sim, pelo RH","Sim, pelo candidato"];
const DISPENSA_DEVOLUTIVA = ["SEM RETORNO","DECLINOU"];
const temDevolutiva = c => String(c.devolutiva||"").trim() !== "";
const precisaDevolutiva = c => !temDevolutiva(c)
  && !DISPENSA_DEVOLUTIVA.includes(String(c.status||"").trim().toUpperCase());
const cargoDe = v => (v.cargo_padrao || v.cargo || "—").trim();

function cargosParaFiltro(vagas){
  const m = {};
  (vagas||[]).forEach(v=>{
    const c = cargoDe(v);
    if(!m[c]) m[c] = {cargo:c, ids:[], abertas:0};
    m[c].ids.push(v.id);
    if((v.status||"").toUpperCase()!=="FECHADA") m[c].abertas++;
  });
  return Object.values(m)
    .sort((a,b)=> b.abertas-a.abertas || a.cargo.localeCompare(b.cargo))
    .map(x=>({ v:x.cargo,
               t:x.cargo + (x.abertas ? "  ("+x.abertas+" aberta"+(x.abertas>1?"s":"")+")" : "") }));
}
function candidatoDoCargo(c, cargo, vagas){
  if(!cargo) return true;
  const v = (vagas||[]).find(x=>x.id===c.vaga_id);
  return v ? cargoDe(v)===cargo : false;
}
function aberturasParaEscolher(vagas, atual){
  return (vagas||[])
    .filter(v => (v.status||"").toUpperCase()!=="FECHADA" || String(v.id)===String(atual))
    .sort((a,b)=> cargoDe(a).localeCompare(cargoDe(b)) || String(b.data_abertura||"").localeCompare(String(a.data_abertura||"")))
    .map(v=>({ v:v.id,
               t: cargoDe(v)
                  + (v.linha ? " · "+v.linha.replace("Linha ","") : "")
                  + (v.codigo ? "  ("+v.codigo+")" : "")
                  + ((v.status||"").toUpperCase()==="FECHADA" ? " — fechada" : "") }));
}
const SLA_DIAS = 3;
const PALETA = ["#292524","#c8960c","#3b82f6","#10b981","#8b5cf6","#f97316","#0891b2","#e11d48","#78716c"];

const S = {
  token:()=>localStorage.getItem("ats_token"), nome:()=>localStorage.getItem("ats_nome"), perfil:()=>localStorage.getItem("ats_perfil"),
  perms:()=>{try{return JSON.parse(localStorage.getItem("ats_perms")||"[]");}catch(e){return [];}},
  foto:()=>localStorage.getItem("ats_foto")||"",
  setFoto:(f)=>f?localStorage.setItem("ats_foto",f):localStorage.removeItem("ats_foto"),
  setNome:(n)=>localStorage.setItem("ats_nome",n),
  set:(t,n,p,perms)=>{localStorage.setItem("ats_token",t);localStorage.setItem("ats_nome",n);localStorage.setItem("ats_perfil",p);localStorage.setItem("ats_perms",JSON.stringify(perms||[]));},
  setPerms:(perms)=>localStorage.setItem("ats_perms",JSON.stringify(perms||[])),
  clear:()=>{["ats_token","ats_nome","ats_perfil","ats_perms","ats_foto"].forEach(k=>localStorage.removeItem(k));}
};
const pode = (perm)=>S.perms().includes(perm);

let LISTAS_API = {};
let CAMPOS_API = [];
const camposDe = ent => CAMPOS_API.filter(c=>c.entidade===ent && c.ativo).sort((a,b)=>a.ordem-b.ordem);
const opcoes = (tipo, reserva) => (LISTAS_API[tipo] && LISTAS_API[tipo].length) ? LISTAS_API[tipo] : reserva;
async function api(path, opts={}){
  const headers = Object.assign({}, opts.headers||{}); const t=S.token(); if(t) headers["Authorization"]="Bearer "+t;
  let res;
  try{
    res = await fetch(API+path, Object.assign({},opts,{headers}));
  }catch(falha){
    const e = new Error("Sem conexao com o servidor do sistema.");
    e.semServidor = true;
    throw e;
  }
  if(res.status===401){ TempoReal.desconectar(); S.clear(); window.location.reload(); throw new Error("Sessão expirada"); }
  if(!res.ok){
    if(res.status===404){
      const err=new Error("Esta função ainda não existe no servidor. "
                        + "Feche a janela preta do iniciar.bat e abra de novo.");
      err.servidorAntigo = true;
      throw err;
    }
    const e=await res.json().catch(()=>({detail:res.statusText}));
    const d=e.detail;
    if(res.status===422 && d && typeof d==="object" && d.tipo==="pendencias"){
      const err=new Error(d.mensagem||"Faltam informações."); err.pendencias=d.pendencias||[]; throw err;
    }
    if(res.status===409 && d && d.tipo==="duplicado"){
      const err=new Error(d.mensagem||"Registro parecido já existe."); err.duplicados=d.encontrados||[]; throw err;
    }
    if(res.status===409 && d && d.tipo==="conflito"){
      const err=new Error(d.mensagem||"Este registro foi alterado por outra pessoa.");
      err.conflito=true; err.versaoAtual=d.versao_atual; throw err;
    }
    if(Array.isArray(d)){
      const txt=d.map(x=>{
        const campo=(x.loc||[]).filter(y=>y!=="body").join(" › ");
        return (campo?campo+": ":"")+(x.msg||"");
      }).join(" · ");
      throw new Error(txt || "Dados inválidos.");
    }
    throw new Error(typeof d==="string" ? d : (d?.mensagem || d?.detail || "Erro inesperado. Tente novamente."));
  }
  return res.status===204?null:res.json();
}
const getJSON = p => api(p);
const sendJSON = (p,method,body)=>api(p,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
function limpo(obj){ const o={}; for(const k in obj){const v=obj[k]; if(v!==""&&v!==undefined) o[k]=(v===null?null:v);} return o; }
function uniq(arr){ return [...new Set(arr.filter(Boolean))].sort(); }
const TempoReal = {
  fonte: null, ultimo: 0, ligado: false,
  ouvintes: new Set(),
  observadores: new Set(),

  inscrever(fn){ this.ouvintes.add(fn); return ()=>this.ouvintes.delete(fn); },
  observarConexao(fn){ this.observadores.add(fn); fn(this.ligado); return ()=>this.observadores.delete(fn); },
  _estado(v){ this.ligado=v; this.observadores.forEach(f=>{ try{f(v);}catch(e){} }); },
  _avisar(itens){ this.ouvintes.forEach(f=>{ try{f(itens);}catch(e){} }); },

  conectar(){
    if(this.fonte || !S.token()) return;
    const url = API+"/eventos?desde="+this.ultimo+"&token="+encodeURIComponent(S.token());
    try{ this.fonte = new EventSource(url); }catch(e){ return; }

    this.fonte.addEventListener("pronto", ev=>{
      try{ this.ultimo = JSON.parse(ev.data).ultimo || this.ultimo; }catch(e){}
      this._estado(true);
    });
    this.fonte.addEventListener("mudanca", ev=>{
      let d={}; try{ d=JSON.parse(ev.data); }catch(e){ return; }
      this.ultimo = d.ultimo || this.ultimo;
      this._estado(true);
      this._avisar(d.itens||[]);
    });
    this.fonte.onopen = ()=> this._estado(true);
    this.fonte.onerror = ()=>{
      this._estado(false);
      if(this.fonte && this.fonte.readyState===2){
        this.fonte.close(); this.fonte=null;
        setTimeout(()=>this.conectar(), 5000);
      }
    };
  },
  desconectar(){ if(this.fonte){ this.fonte.close(); this.fonte=null; } this._estado(false); }
};

function useSincronizar(recarregar, interesses){
  useEffect(()=>{
    const ocupado = () => document.querySelector("[data-modal-aberto]");
    const importa = (itens) => !interesses || !interesses.length ||
      itens.some(i=>interesses.includes(i.entidade));

    const sair1 = TempoReal.inscrever(itens=>{
      if(ocupado()) return;
      if(importa(itens)) recarregar();
    });
    const t = setInterval(()=>{
      if(!TempoReal.ligado && document.visibilityState==="visible" && !ocupado()) recarregar();
    }, 30000);
    const aoVoltar = ()=>{ if(document.visibilityState==="visible" && !ocupado()) recarregar(); };
    document.addEventListener("visibilitychange", aoVoltar);
    window.addEventListener("online", aoVoltar);

const Pref = {
  chave(nome){ return "ats_pref_" + (S.nome()||"anon") + "_" + nome; },
  ler(nome, padrao){
    try{ const v = localStorage.getItem(this.chave(nome)); return v ? JSON.parse(v) : padrao; }
    catch(e){ return padrao; }
  },
  gravar(nome, valor){
    try{ localStorage.setItem(this.chave(nome), JSON.stringify(valor)); }catch(e){}
  },
};

function usePreferencia(nome, padrao){
  const [v, setV] = useState(()=>Pref.ler(nome, padrao));
  const trocar = (novo)=>{
    setV(anterior=>{
      const valor = typeof novo === "function" ? novo(anterior) : novo;
      Pref.gravar(nome, valor);
      return valor;
    });
  };
  return [v, trocar];
}

function useOrdenacao(nome, campoPadrao, sentidoPadrao){
  const [ord, setOrd] = usePreferencia(nome, {campo:campoPadrao||null, desc:!!sentidoPadrao});
  const alternar = campo => setOrd(a => a.campo===campo ? {campo, desc:!a.desc} : {campo, desc:false});
  const ordenar = (lista, extratores)=>{
    if(!ord.campo) return lista;
    const pega = (extratores && extratores[ord.campo]) || (x=>x[ord.campo]);
    const copia = [...lista];
    copia.sort((a,b)=>{
      let x = pega(a), y = pega(b);
      const vx = x===null||x===undefined||x==="", vy = y===null||y===undefined||y==="";
      if(vx && vy) return 0;
      if(vx) return 1;
      if(vy) return -1;
      if(typeof x === "number" && typeof y === "number") return ord.desc ? y-x : x-y;
      x = String(x); y = String(y);
      const r = x.localeCompare(y, "pt-BR", {numeric:true, sensitivity:"base"});
      return ord.desc ? -r : r;
    });
    return copia;
  };
  return {ord, alternar, ordenar};
}

async function emLote(itens, acao, rotulo){
  let ok=0; const falhas=[];
  const aviso = Avisos.mostrar(`${rotulo}: 0 de ${itens.length}...`, "info", 600);
  for(let i=0;i<itens.length;i++){
    try{ await acao(itens[i]); ok++; }
    catch(e){ falhas.push((itens[i] && itens[i].nome ? itens[i].nome : "registro")+": "+e.message); }
    Avisos.atualizar(aviso, `${rotulo}: ${i+1} de ${itens.length}...`);
  }
  Avisos.fechar(aviso);
  if(falhas.length===0) avisar.ok(`${rotulo}: ${ok} de ${itens.length} concluído${ok>1?"s":""}.`);
  else if(ok===0)       avisar.erro(`Nada foi alterado.\n${falhas.slice(0,3).join("\n")}`);
  else                  avisar.erro(`${ok} de ${itens.length} deram certo.\nFalharam:\n${falhas.slice(0,3).join("\n")}`);
  return ok;
}

function useAtalhos(mapa){
  useEffect(()=>{
    const aoTeclar=e=>{
      const alvo=e.target;
      const digitando = alvo && /^(INPUT|TEXTAREA|SELECT)$/.test(alvo.tagName);
      for(const [combo, fn] of Object.entries(mapa)){
        const partes=combo.toLowerCase().split("+");
        const tecla=partes[partes.length-1];
        const precisaCtrl=partes.includes("ctrl");
        if(precisaCtrl !== (e.ctrlKey||e.metaKey)) continue;
        if(!precisaCtrl && digitando) continue;
        if(e.key.toLowerCase()!==tecla) continue;
        e.preventDefault(); fn(); return;
      }
    };
    window.addEventListener("keydown", aoTeclar);
    return ()=>window.removeEventListener("keydown", aoTeclar);
  });
}

function plural(n, singular, pluralIrregular){
  const num = Number(n) || 0;
  if (num === 1) return num + " " + singular;
  let p = pluralIrregular;
  if (!p){
    if (/ção$|são$|ão$/.test(singular)) p = singular.replace(/ão$/, "ões");
    else if (/[rzs]$/.test(singular))   p = singular + "es";
    else if (/m$/.test(singular))       p = singular.replace(/m$/, "ns");
    else if (/il$/.test(singular))      p = singular.replace(/il$/, "is");
    else if (/l$/.test(singular))       p = singular.replace(/l$/, "is");
    else                                p = singular + "s";
  }
  return num + " " + p;
}
function fmtData(d){ if(!d) return "-"; return String(d).slice(0,10).split("-").reverse().join("/"); }
function soData(v){
  if(!v) return null;
  const t=String(v).slice(0,10).split("-");
  if(t.length!==3) return null;

function diasEntre(a,b){

function limitesPeriodo(per){
  const hoje=new Date(); const iso=d=>d.toISOString().slice(0,10); let ini=null,fim=null;
  if(per.tipo==="mes") ini=iso(new Date(hoje.getFullYear(),hoje.getMonth(),1));
  else if(per.tipo==="30d"){const d=new Date(hoje);d.setDate(d.getDate()-30);ini=iso(d);}
  else if(per.tipo==="90d"){const d=new Date(hoje);d.setDate(d.getDate()-90);ini=iso(d);}
  else if(per.tipo==="ano") ini=iso(new Date(hoje.getFullYear(),0,1));
  else if(per.tipo==="custom"){ini=per.de||null;fim=per.ate||null;}
  return [ini,fim];
}

const Confirma = {
  ouvinte: null, pendente: null,
  perguntar(op){
    return new Promise(resolve=>{
      this.pendente = {resolve, ...(typeof op==="string" ? {titulo:op} : op)};
      if(this.ouvinte) this.ouvinte(this.pendente);
    });
  },
  responder(v){
    const p = this.pendente;
    this.pendente = null;
    if(this.ouvinte) this.ouvinte(null);
    if(p) p.resolve(v);
  },
};
const confirmar = (op)=>Confirma.perguntar(op);

const Escolha = {
  ouvinte: null, pendente: null,
  perguntar(op){
    return new Promise(resolve=>{
      this.pendente = {resolve, ...op};
      if(this.ouvinte) this.ouvinte(this.pendente);
    });
  },
  responder(v){
    const p = this.pendente; this.pendente = null;
    if(this.ouvinte) this.ouvinte(null);
    if(p) p.resolve(v);
  },
};
const escolher = (op)=>Escolha.perguntar(op);

function Botao({children,onClick,tipo="primario",small,submit,disabled,carregando}){
  const c={primario:"bg-stone-900 hover:bg-stone-800 text-white brilho-acao shadow-[0_1px_2px_rgba(28,25,23,.18)]",
           claro:"bg-white hover:bg-stone-50 text-stone-700 ring-1 ring-stone-200 hover:ring-stone-300",
           verde:"bg-emerald-600 hover:bg-emerald-700 text-white shadow-[0_1px_2px_rgba(5,150,105,.25)]",
           vermelho:"bg-red-600 hover:bg-red-700 text-white shadow-[0_1px_2px_rgba(220,38,38,.25)]"}[tipo];
  const [ocupado,setOcupado]=useState(false);
  const clicar = e => {
    if(ocupado || disabled) return;
    const r = onClick && onClick(e);
    if(r && typeof r.then === "function"){
      setOcupado(true);
      r.finally(()=>setOcupado(false));
    }
  };
  const trabalhando = carregando || ocupado;
  return <button type={submit?"submit":"button"} onClick={clicar} disabled={disabled||trabalhando}
    className={c+" relative inline-flex items-center gap-1.5 rounded-lg font-semibold transition-all duration-150 active:scale-[.97] disabled:opacity-60 disabled:cursor-not-allowed disabled:active:scale-100 "+(small?"px-3 py-1.5 text-[12.5px]":"px-4 py-2 text-sm")}>

    {children}</button>;
}

function AcoesRapidas({cand, aoMudar}){
  const [aberto,setAberto]=useState(false),[ocupado,setOcupado]=useState(false);
  const etapas = opcoes("etapa",ETAPAS);
  const iAtual = etapas.indexOf(cand.etapa_atual);
  const proxima = iAtual>=0 && iAtual<etapas.length-1 ? etapas[iAtual+1] : null;
  const encerrado = ehFinal(cand.status);

  async function aplicar(mudanca, rotulo){
    if(ocupado) return;
    setOcupado(true); setAberto(false);
    try{ await sendJSON("/candidatos/"+cand.id,"PATCH",{...mudanca, versao:cand.versao});
         aoMudar && aoMudar(); }
    catch(e){
      if(e.pendencias) avisar.erro("Faltam informações para "+rotulo+":\n\n"
        + e.pendencias.map(p=>"• "+p.rotulo).join("\n")
        + "\n\nAbra a ficha para completar.");
      else avisar.erro(e.message);
    }
    finally{ setOcupado(false); }
  }

  return (<span className="relative inline-block">
    <button onClick={e=>{e.stopPropagation(); setAberto(!aberto);}} disabled={ocupado}
      title="Ações rápidas"
      className="w-7 h-7 rounded-lg text-stone-400 hover:text-stone-900 hover:bg-stone-100 leading-none">
      {ocupado ? "..." : "⋯"}
    </button>
    {aberto && <>
      <span className="fixed inset-0 z-20" onClick={e=>{e.stopPropagation(); setAberto(false);}}></span>
      <span className="absolute right-0 top-8 z-30 w-56 bg-white rounded-xl shadow-xl ring-1 ring-black/5 py-1 text-left">
        {!encerrado && proxima &&
          <button onClick={e=>{e.stopPropagation(); aplicar({etapa_atual:proxima}, "avançar");}}
            className="w-full text-left px-3 py-2 text-sm hover:bg-stone-50">
            Avançar para <b>{proxima}</b></button>}
        {!encerrado &&
          <button onClick={e=>{e.stopPropagation(); aplicar({status:"APROVADO"}, "aprovar");}}
            className="w-full text-left px-3 py-2 text-sm hover:bg-emerald-50 text-emerald-700">
            Aprovar</button>}
        {!encerrado &&
          <button onClick={e=>{e.stopPropagation(); aplicar({status:"REPROVADO"}, "reprovar");}}
            className="w-full text-left px-3 py-2 text-sm hover:bg-red-50 text-red-700">
            Reprovar</button>}
        {encerrado &&
          <button onClick={e=>{e.stopPropagation(); aplicar({status:null, etapa_atual:etapas[0]}, "reabrir");}}
            className="w-full text-left px-3 py-2 text-sm hover:bg-stone-50">
            Voltar para o processo</button>}
        <span className="block border-t border-stone-100 my-1"></span>
        <button onClick={e=>{e.stopPropagation(); aplicar({banco_talentos:!cand.banco_talentos}, "guardar");}}
          className="w-full text-left px-3 py-2 text-sm hover:bg-amber-50">
          {cand.banco_talentos ? "Tirar do banco de talentos" : "Guardar no banco de talentos"}</button>
      </span>
    </>}
  </span>);
}

function Grafico({tipo, labels, valores, titulo, cores, altura=220}){
  const ref=useRef(null); const chart=useRef(null);
  useEffect(()=>{
    if(!ref.current || !window.Chart) return;
    if(chart.current) chart.current.destroy();
    const bg = cores || (tipo==="line" ? "#6366f1" : labels.map((_,i)=>PALETA[i%PALETA.length]));
    chart.current=new Chart(ref.current.getContext("2d"),{
      type:tipo,
      data:{labels, datasets:[{label:titulo||"", data:valores, backgroundColor:bg,
        borderColor: tipo==="line"?"#6366f1":bg, borderWidth: tipo==="line"?2:0, tension:.3, fill:false,
        borderRadius: tipo==="bar"?6:0, pointRadius:3}]},
      options:{responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display: tipo==="doughnut", position:"bottom", labels:{boxWidth:12,font:{size:11}}}},
        scales: tipo==="doughnut"?{}:{x:{grid:{display:false}}, y:{beginAtZero:true, ticks:{precision:0}}}}
    });
    return ()=>{ if(chart.current) chart.current.destroy(); };
  },[JSON.stringify(labels),JSON.stringify(valores),tipo]);
  return <div style={{height:altura}}><canvas ref={ref}></canvas></div>;
}

  const atrasoGestor=aguardandoGestor[0]?.dias_parado??0;

  const alertas=[

    aguardandoGestor.length && {txt:plural(aguardandoGestor.length,"parecer")+" com a gestão"+(atrasoGestor>SLA_DIAS?" · "+plural(atrasoGestor,"dia")+" de espera":""),

    semEtapa.length && {txt:plural(semEtapa.length,"candidato")+" sem entrevista marcada", ir:()=>irPara("funil")},
    vagasAntigas.length && {txt:plural(vagasAntigas.length,"vaga")+" aberta há +60 dias", ir:()=>irPara("vagas")},
  ].filter(Boolean);

  const hora=agora.getHours();
  const saudacao=hora<12?"Bom dia":hora<18?"Boa tarde":"Boa noite";

  const nomeDia=d=>{const x=new Date(d+"T00:00:00"); return x.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"});};
  const porDia={}; daSemana.forEach(e=>{ (porDia[e.dia]=porDia[e.dia]||[]).push(e); });

  const LinhaEvento=({e,destaque})=>{

            </div>
            <button onClick={()=>irPara("agenda")}

            : <div className="divide-y divide-stone-50 border-t border-stone-100">

        {daSemana.length>0 && <div className="surface overflow-hidden aparece">
          <div className="px-5 pt-4 pb-3">
            <div className="t-secao">Próximos dias</div>

          <div className="border-t border-stone-100 max-h-[26rem] overflow-auto">
            {Object.keys(porDia).sort().map(dia=>(<div key={dia}>

    </div>
    {ficha && <FichaCandidato cand={ficha} vagas={vagas} onClose={()=>setFicha(null)} onMudou={()=>{setFicha(null);recarregar();}}/>}
  </div>);
}

function ChipPeriodo({ativo,onClick,children}){

}
function Painel(){
  const [cands,setCands]=useState(null),[vagas,setVagas]=useState(null),[erro,setErro]=useState("");
  const [per,setPer]=useState({tipo:"ano",de:"",ate:""});
  const [aval,setAval]=useState(null);
  useEffect(()=>{ Promise.all([getJSON("/candidatos"),getJSON("/vagas")]).then(([b,c])=>{setCands(b);setVagas(c);}).catch(e=>setErro(e.message)); },[]);
  useEffect(()=>{ getJSON("/avaliacoes").then(setAval).catch(()=>{}); },[]);
  if(erro) return <Erro msg={erro}/>;
  if(!cands||!vagas) return <Esqueleto linhas={6} tipo="cartoes"/>;

  const hoje=new Date(); const iso=d=>d.toISOString().slice(0,10);
  let ini=null, fim=null;
  if(per.tipo==="mes") ini=iso(new Date(hoje.getFullYear(),hoje.getMonth(),1));
  else if(per.tipo==="30d"){const d=new Date(hoje);d.setDate(d.getDate()-30);ini=iso(d);}
  else if(per.tipo==="90d"){const d=new Date(hoje);d.setDate(d.getDate()-90);ini=iso(d);}
  else if(per.tipo==="ano") ini=iso(new Date(hoje.getFullYear(),0,1));
  else if(per.tipo==="custom"){ ini=per.de||null; fim=per.ate||null; }
  const entrada=c=>(c.data_1a_etapa||c.contato_inicial||"").slice(0,10);
  const noPeriodo=c=>{ if(per.tipo==="tudo") return true; const e=entrada(c); if(!e) return false; if(ini&&e<ini) return false; if(fim&&e>fim) return false; return true; };
  const base=cands.filter(noPeriodo);
  const up=s=>(s||"").toUpperCase();

  const recebidos=base.length, contatados=base.filter(c=>c.contato_inicial).length;
  const entRH=base.filter(c=>c.data_1a_etapa).length, entGestao=base.filter(c=>c.data_2a_etapa).length;
  const aprovados=base.filter(c=>up(c.status)==="APROVADO").length;
  const funil=[["1. Recebidos",recebidos],["2. Contatados",contatados],["3. Entrevista RH",entRH],["4. Entrev. Gestão",entGestao],["5. Aprovados",aprovados]];
  const emProcesso=base.filter(c=>!ehFinal(c.status)).length, taxa=recebidos?aprovados/recebidos:0;

  const med=arr=>{arr=arr.filter(x=>x!=null&&x>=0); return arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):"—";};
  const tHire=med(base.filter(c=>up(c.status)==="APROVADO").map(c=>diasEntre(c.data_1a_etapa,c.data_aprovacao)));

  const cont=(arr,fn)=>{const m={};arr.forEach(x=>{const k=fn(x)||"—";m[k]=(m[k]||0)+1;});return m;};
  const porStatus=cont(base,c=>c.status||"em processo");
  const origens=uniq(base.map(c=>c.origem));
  const desempOrigem=origens.map(o=>{const g=base.filter(c=>c.origem===o); const ap=g.filter(c=>up(c.status)==="APROVADO").length; return {origem:o,total:g.length,aprovados:ap,taxa:g.length?ap/g.length:0};}).sort((a,b)=>b.total-a.total);
  const mesM={}; base.filter(c=>c.data_aprovacao&&up(c.status)==="APROVADO").forEach(c=>{const k=String(c.data_aprovacao).slice(0,7);mesM[k]=(mesM[k]||0)+1;});
  const mo=Object.keys(mesM).sort();

  const conv=(i)=> i===0?1:(funil[i-1][1]?funil[i][1]/funil[i-1][1]:0);

  const melhorOrigem = desempOrigem.filter(o=>o.total>=3).sort((a,b)=>b.taxa-a.taxa)[0];

  return (<div className="space-y-6">

          a.download="ATS_TLM_"+new Date().toISOString().slice(0,10)+".xlsx"; a.click();

        <span className="text-[13px] text-stone-500">até</span>

    {}

      <div className="text-[11px] uppercase tracking-wider text-stone-400 font-semibold mb-2">Leitura rápida</div>
      <div className="space-y-1.5 text-[13.5px] text-stone-600">
        {gargalo && <div className="flex gap-2"><span className="text-stone-400 shrink-0">•</span><span>

        {melhorOrigem && <div className="flex gap-2"><span className="text-stone-400 shrink-0">•</span><span>
          <b className="text-stone-800">{melhorOrigem.origem}</b> é a origem que mais converte — {(melhorOrigem.taxa*100).toFixed(0)}% dos {melhorOrigem.total} candidatos foram aprovados.</span></div>}
        {tHire!=="—" && <div className="flex gap-2"><span className="text-stone-400 shrink-0">•</span><span>
          Da 1ª entrevista até a aprovação leva <b className="text-stone-800">{tHire} dias</b> em média.</span></div>}
      </div>
    </div>}

    <SecaoRel titulo="Os números do período"
      explica="Quantas pessoas entraram, quantas ainda estão em processo e quantas viraram contratação. O tempo médio mostra a demora entre a primeira entrevista e a aprovação.">
    <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-6 gap-3">
      <KPI titulo="Candidatos" valor={recebidos} icon="candidatos"/>

      <KPI titulo="Aprovados" valor={aprovados} icon="check" cor="text-emerald-600" bg="bg-emerald-50"/>
      <KPI titulo="Taxa aprovação" valor={(taxa*100).toFixed(1)+"%"} icon="painel" cor="text-stone-600" bg="bg-stone-100"/>
      <KPI titulo="Tempo médio" valor={tHire} hint="dias até aprovar" icon="relogio" cor="text-violet-600" bg="bg-violet-50"/>
      <KPI titulo="Até 1ª etapa" valor={tPrimeira} hint="dias após o contato" icon="relogio" cor="text-sky-600" bg="bg-sky-50"/>
    </div>
    </SecaoRel>

    {}
    <SecaoRel titulo="Onde o funil estreita"
      explica="Cada barra é uma etapa. A porcentagem à direita diz quantos avançaram vindos da etapa anterior — quanto menor o número, mais gente ficou pelo caminho ali.">

          return (<div key={k}>
            <div className="flex items-baseline justify-between gap-2 mb-1">
              <span className="text-[13px] text-stone-600 truncate">{k.replace(/^\d+\.\s*/,"")}</span>
              <span className="text-[13px] shrink-0"><b className="text-stone-900 tabular-nums">{v}</b>
                {i>0 && <span className={"ml-2 tabular-nums "+(conv(i)<0.6?"text-amber-700":"text-stone-400")}>{(conv(i)*100).toFixed(0)}%</span>}</span>
            </div>
            <div className="h-2.5 rounded-full bg-stone-100 overflow-hidden">
              <div className="h-full rounded-full transition-all duration-500" style={{width:larg+"%", background:i===funil.length-1?"#10b981":"#292524"}}></div>
            </div>
            {i>0 && perdeu>0 && <div className="text-[11px] text-stone-400 mt-0.5">{perdeu} não avançaram</div>}
          </div>); })}
      </div>
    </Bloco>
    </SecaoRel>

    <SecaoRel titulo="Por que perdemos candidatos"
      explica="A rosca mostra em que situação está cada pessoa hoje. As barras mostram o motivo de quem saiu do processo — reprovação nossa é diferente de desistência ou falta de retorno.">
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <Bloco titulo="Candidatos por status"><Grafico tipo="doughnut" labels={Object.keys(porStatus)} valores={Object.values(porStatus)}/></Bloco>
      <Bloco titulo="Motivos de perda">
        {motivos.length? <Grafico tipo="bar" labels={motivos.map(([k])=>k)} valores={motivos.map(([,v])=>v)} cores={["#ef4444","#f97316","#f59e0b","#a1a1aa","#64748b"]}/>
          : <div className="text-sm text-stone-400 py-10 text-center">Nenhuma perda no período.</div>}
      </Bloco>
    </div>
    </SecaoRel>

    <SecaoRel titulo="Ritmo de contratação"
      explica="Quantas pessoas foram aprovadas em cada mês. Serve para ver se o RH está entregando de forma constante ou em picos.">
    <div className="grid grid-cols-1 gap-4">
      <Bloco titulo="Contratações por mês">
        {mo.length? <Grafico tipo="line" labels={mo.map(m=>m.split("-").reverse().join("/"))} valores={mo.map(m=>mesM[m])}/>
          : <div className="text-sm text-stone-400 py-10 text-center">Sem contratações no período.</div>}
      </Bloco>
    </div>

    </SecaoRel>

    {aval && aval.total>0 && <SecaoRel titulo="Como o time avalia as entrevistas"
      explica="Se uma pessoa recomenda contratar em 90% dos casos e outra em 20%, a nota das duas não significa a mesma coisa — e a decisão precisa levar isso em conta.">
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Bloco titulo="Por avaliador">
          <div className="space-y-2.5">
            {aval.por_avaliador.map(a=>(
              <div key={a.avaliador}>
                <div className="flex items-baseline justify-between gap-2 mb-1">
                  <span className="text-[13px] text-stone-700 truncate">{a.avaliador}</span>
                  <span className="text-[13px] shrink-0">
                    <b className="text-stone-900 tabular-nums">{Math.round(a.taxa_recomendacao*100)}%</b>
                    <span className="text-stone-400 ml-2 tabular-nums">
                      {a.media!=null?a.media.toFixed(1)+"/5":"—"} · {plural(a.avaliacoes,"avaliação","avaliações")}</span>
                  </span>
                </div>
                <div className="h-2 rounded-full bg-stone-100 overflow-hidden">
                  <div className="h-full rounded-full bg-stone-800 transition-all duration-500"
                       style={{width:(a.taxa_recomendacao*100)+"%"}}></div>
                </div>
              </div>))}
          </div>
          <div className="t-apoio mt-3">A barra mostra em que proporção a pessoa recomendou contratar.</div>
        </Bloco>

        <Bloco titulo="Onde os candidatos vão pior">
          <div className="space-y-2.5">
            {aval.por_criterio.map(c2=>(
              <div key={c2.criterio}>
                <div className="flex items-baseline justify-between gap-2 mb-1">
                  <span className="text-[13px] text-stone-700 truncate">{c2.criterio}</span>
                  <span className="text-[13px] tabular-nums"><b className="text-stone-900">{c2.media.toFixed(1)}</b>
                    <span className="text-stone-400"> de 5</span></span>
                </div>
                <div className="h-2 rounded-full bg-stone-100 overflow-hidden">
                  <div className={"h-full rounded-full transition-all duration-500 "
                    +(c2.media<3?"bg-red-400":c2.media<4?"bg-amber-400":"bg-emerald-500")}
                       style={{width:(c2.media/5*100)+"%"}}></div>
                </div>
              </div>))}
          </div>
          <div className="t-apoio mt-3">Do pior para o melhor. Critério baixo direto pode indicar
            anúncio mal direcionado, não candidato ruim.</div>
        </Bloco>
      </div>
    </SecaoRel>}

    <SecaoRel titulo="De onde vem a demanda e de onde vem gente boa"
      explica="A barra colorida diz se as vagas nasceram de crescimento ou de reposição. A tabela abaixo mostra qual canal traz candidato que realmente é aprovado — nem sempre o que traz mais currículo é o que traz melhor gente.">
    <Bloco titulo="Por que as vagas abriram">
      {(()=>{ const m={}; vagas.forEach(v=>{ const k=(v.motivo||"não informado"); m[k]=(m[k]||0)+1; });
        const tot=Object.values(m).reduce((a,b)=>a+b,0);
        if(!tot) return <div className="text-sm text-stone-400 py-6 text-center">Nenhuma vaga cadastrada ainda.</div>;
        const cores={"AMPLIAÇÃO":"bg-emerald-500","SUBSTITUIÇÃO":"bg-stone-700","não informado":"bg-stone-300"};
        return (<div>
          <div className="flex h-3 rounded-full overflow-hidden mb-3">
            {Object.entries(m).map(([k,n])=><div key={k} className={cores[k]||"bg-stone-300"} style={{width:(n/tot*100)+"%"}} title={k+": "+n}></div>)}
          </div>
          <div className="flex gap-x-5 gap-y-2 flex-wrap text-sm">
            {Object.entries(m).map(([k,n])=>(<span key={k} className="flex items-center gap-2">
              <span className={"w-2.5 h-2.5 rounded-full "+(cores[k]||"bg-stone-300")}></span>
              <span className="text-stone-600">{k}</span>
              <b className="text-stone-900">{n}</b>
              <span className="text-stone-400 text-xs">({(n/tot*100).toFixed(0)}%)</span></span>))}
          </div>
          <div className="text-xs text-stone-400 mt-3">Ampliação = crescimento do time · Substituição = reposição de saída.</div>
        </div>); })()}
    </Bloco>

    <Bloco titulo="Desempenho por origem" acao={<span className="text-xs text-stone-400 hidden sm:block">de onde vem quem realmente entra</span>}>
      {}
      <div className="overflow-x-auto -mx-px">
        <table className="w-full text-sm tabela">
          <thead className="text-stone-500"><tr>{["Origem","Candidatos","Aprovados","% aprovação",""].map(c=><th key={c} className="text-left px-3 py-2 font-medium">{c}</th>)}</tr></thead>
          <tbody>
            {desempOrigem.length===0 && <tr><td colSpan="5" className="px-3 py-4 text-center text-stone-400">Sem dados no período.</td></tr>}
            {desempOrigem.map(o=>(<tr key={o.origem} className="border-t border-stone-100 hover:bg-stone-50/70 transition-colors">
              <td className="px-3 py-2 font-medium text-stone-700">{o.origem}</td>
              <td className="px-3 py-2 tabular-nums">{o.total}</td>
              <td className="px-3 py-2 text-emerald-600 font-medium tabular-nums">{o.aprovados}</td>
              <td className="px-3 py-2 tabular-nums">{(o.taxa*100).toFixed(1)}%</td>
              <td className="px-3 py-2 w-40"><div className="bg-stone-100 rounded h-2"><div className="bg-stone-800 h-2 rounded transition-all duration-500" style={{width:(o.taxa*100)+"%"}}></div></div></td>
            </tr>))}
          </tbody>
        </table>
      </div>
    </Bloco>
    </SecaoRel>
  </div>);
}
const CORES_ETAPA={
  "1. Recebido":"#94a3b8",
  "2. Triado":"#3b82f6",
  "3. Entrevista RH":"#8b5cf6",
  "4. Entrevista Gestão":"#f59e0b",
  "5. Congelado":"#06b6d4",
  "6. Aprovado":"#22c55e",
  "0. Encerrado":"#ef4444"
};

function CardFunil({c, cor, vagaLabel, podeMover, aoAbrir, aoMudar}){
  const parado = c.dias_parado!=null && !ehFinal(c.status) ? c.dias_parado : null;
  const atrasado = parado!=null && parado>SLA_DIAS;
  return (
    <div draggable={podeMover}
      onDragStart={e=>e.dataTransfer.setData("id",String(c.id))}
      onClick={()=>aoAbrir(c)}
      style={{borderLeft:"3px solid "+cor}}
      className="card-cand group bg-white rounded-xl ring-1 ring-stone-200/70 p-3 cursor-pointer hover:ring-stone-300">
      <div className="flex items-start gap-2.5">
        <Avatar nome={c.nome} sm/>
        <div className="flex-1 min-w-0">
          <div className="text-[13.5px] font-medium text-stone-800 leading-snug truncate">{c.nome}</div>
          <div className="t-apoio truncate">{vagaLabel(c.vaga_id)}</div>
        </div>
        {podeMover && <span onClick={e=>e.stopPropagation()}
          className="opacity-0 group-hover:opacity-100 transition-opacity">
          <AcoesRapidas cand={c} aoMudar={aoMudar}/></span>}
      </div>
      {(c.status || parado!=null || c.banco_talentos) &&
        <div className="flex items-center gap-2 mt-2.5 flex-wrap">
          {c.status && <Tag texto={c.status} cor={corStatus(c.status)} suave/>}
          {parado!=null && (atrasado
            ? <Tag texto={"parado " + plural(parado,"dia")} cor="bg-red-100 text-red-700"/>
            : <span className="t-apoio num">{parado}d</span>)}
          {c.banco_talentos && <span className="t-apoio" title="No banco de talentos">★</span>}
        </div>}
      {}
      <div className="mt-2 hidden group-hover:block">
        <ProximoPasso c={c}/>
      </div>
    </div>);
}

function Kanban(){
  const [cands,setCands]=useState(null),[vagas,setVagas]=useState([]),[erro,setErro]=useState("");
  const [fVaga,setFVaga]=useState(""),[ficha,setFicha]=useState(null),[over,setOver]=useState("");
  const [verEnc,setVerEnc]=useState(false),[novo,setNovo]=useState(null);
  const [per,setPer]=useState({tipo:"tudo",de:"",ate:""});
  const [colunaCelular,setColunaCelular]=useState(null);
  function recarregar(){ getJSON("/candidatos").then(setCands).catch(e=>setErro(e.message)); }
  useEffect(()=>{ recarregar(); getJSON("/vagas").then(setVagas).catch(()=>{}); },[]);
  useSincronizar(recarregar, ["candidato","vaga"]);
  if(erro) return <Erro msg={erro}/>;
  if(!cands) return <Esqueleto linhas={5} tipo="lista"/>;

  const podeMover = pode("candidatos.editar")||pode("candidatos.parecer");
  const colunas = opcoes("etapa",ETAPAS).filter(e=> verEnc || e!=="0. Encerrado");
  const colDe = c => opcoes("etapa",ETAPAS).includes(c.etapa_atual) ? c.etapa_atual : "1. Recebido";
  const vagaLabel = id => { const v=vagas.find(x=>x.id===id); return v?cargoDe(v):"sem vaga"; };
  const visiveis = cands.filter(c=> candidatoDoCargo(c,fVaga,vagas) && dentroPeriodo(c,per));
  const daColuna = col => visiveis.filter(c=>colDe(c)===col);
  const travados = col => daColuna(col).filter(c=>c.dias_parado!=null && c.dias_parado>SLA_DIAS && !ehFinal(c.status)).length;
  const atual = colunaCelular || colunas[0];

  async function soltar(etapa, e){
    e.preventDefault(); setOver("");
    const id=e.dataTransfer.getData("id"); if(!id) return;
    const c=cands.find(x=>String(x.id)===id); if(!c || colDe(c)===etapa) return;
    setCands(cs=>cs.map(x=>String(x.id)===id?{...x,etapa_atual:etapa}:x));
    try{ await sendJSON("/candidatos/"+id,"PATCH",{etapa_atual:etapa, versao:c.versao}); }
    catch(err){ avisar.erro(err.message); recarregar(); }
  }
  async function mover(c, etapa){
    setCands(cs=>cs.map(x=>x.id===c.id?{...x,etapa_atual:etapa}:x));
    try{ await sendJSON("/candidatos/"+c.id,"PATCH",{etapa_atual:etapa, versao:c.versao}); }
    catch(err){ avisar.erro(err.message); recarregar(); }
  }

  return (<div>
    <div className="flex items-start justify-between mb-4 flex-wrap gap-3">
      <div>
        <h2 className="t-titulo">Funil</h2>
        <p className="text-[13px] text-stone-500 mt-0.5">Arraste o cartão para mover o candidato de etapa.</p>
        <p className="t-apoio">{podeMover
          ? "Arraste os cartões entre as etapas — no celular, use o menu do cartão."
          : "Acompanhe onde cada pessoa está no processo."}</p>
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        {pode("candidatos.criar") && <Botao small onClick={()=>setNovo(colunas[0])}><Icon name="mais" cls="w-4 h-4"/>Novo candidato</Botao>}
      </div>
    </div>

    {}
    <div className="surface p-3 mb-4 flex items-center gap-2 flex-wrap">
      <div className="w-full sm:w-60"><Combo value={fVaga} onChange={e=>setFVaga(e.target.value)}
        options={cargosParaFiltro(vagas)} placeholder="Todos os cargos"/></div>
      <span className="hidden sm:inline text-stone-200">|</span>
      {[["tudo","Tudo"],["mes","Este mês"],["30d","30 dias"],["90d","90 dias"]].map(([t,l])=>
        <ChipPeriodo key={t} ativo={per.tipo===t} onClick={()=>setPer({tipo:t,de:"",ate:""})}>{l}</ChipPeriodo>)}
      <label className="flex items-center gap-2 t-corpo ml-auto">
        <input type="checkbox" checked={verEnc} onChange={e=>setVerEnc(e.target.checked)}/> Mostrar encerrados
      </label>
    </div>

    {}
    <div className="lg:hidden">
      <div className="flex gap-2 overflow-x-auto pb-2 mb-3 -mx-1 px-1">
        {colunas.map(col=>{
          const n=daColuna(col).length, t=travados(col), sel=atual===col;
          return (<button key={col} onClick={()=>setColunaCelular(col)}
            className={"shrink-0 px-3 py-2 rounded-xl text-[12.5px] font-medium transition ring-1 "
              +(sel?"bg-stone-900 text-white ring-stone-900":"bg-white text-stone-600 ring-stone-200")}>
            <span className="inline-flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full" style={{background:CORES_ETAPA[col]}}></span>
              {col.replace(/^\d+\.\s*/,"")}
              <span className={"num "+(sel?"text-white/70":"text-stone-400")}>{n}</span>
              {t>0 && <span className="text-red-500">•</span>}
            </span>
          </button>);
        })}
      </div>
      <div className="space-y-2">
        {daColuna(atual).length===0
          ? <Vazio icone="funil" titulo={"Ninguém em “"+atual+"”"}
              texto="Escolha outra etapa acima ou cadastre um candidato."/>
          : daColuna(atual).map(c=>(
            <div key={c.id}>
              <CardFunil c={c} cor={CORES_ETAPA[atual]} vagaLabel={vagaLabel}
                podeMover={false} aoAbrir={setFicha} aoMudar={recarregar}/>
              {podeMover && <div className="flex gap-1.5 mt-1.5 mb-3 flex-wrap">
                {colunas.filter(x=>x!==atual).slice(0,3).map(x=>(
                  <button key={x} onClick={()=>mover(c,x)}
                    className="px-2.5 py-1 rounded-lg text-[11px] bg-stone-100 text-stone-600 hover:bg-stone-200 transition">
                    mover p/ {x.replace(/^\d+\.\s*/,"")}</button>))}
              </div>}
            </div>))}
      </div>
    </div>

    {}
    <div className="hidden lg:flex gap-3 overflow-x-auto pb-3">
      {colunas.map(col=>{
        const itens=daColuna(col), t=travados(col);
        return (<div key={col}
          onDragOver={e=>{e.preventDefault(); if(podeMover)setOver(col);}}
          onDragLeave={()=>setOver("")}
          onDrop={e=>podeMover&&soltar(col,e)}
          className={"col-drop w-[290px] shrink-0 bg-stone-100/50 rounded-2xl ring-1 ring-stone-200/60 overflow-hidden "+(over===col?"over":"")}>
          <div className="h-1" style={{background:CORES_ETAPA[col]}}></div>
          <div className="px-3.5 pt-3 pb-2.5">
            <div className="flex items-center justify-between">
              <span className="text-[12.5px] font-semibold text-stone-700">{col.replace(/^\d+\.\s*/,"")}</span>
              <span className="flex items-center gap-1.5">
                {pode("candidatos.criar") && <button onClick={()=>setNovo(col)} title={"Novo candidato em "+col}
                  className="text-stone-300 hover:text-stone-700 transition-colors"><Icon name="mais" cls="w-4 h-4"/></button>}
                <span className="text-[12.5px] font-bold text-stone-500 num">{itens.length}</span>
              </span>
            </div>
            {t>0 && <div className="mt-1 text-[11px] text-red-600">{plural(t,"parado")} há mais de {SLA_DIAS} dias</div>}
          </div>
          <div className="px-2 pb-2 space-y-2 min-h-[110px] max-h-[64vh] overflow-y-auto">
            {itens.map(c=>(
              <CardFunil key={c.id} c={c} cor={CORES_ETAPA[col]} vagaLabel={vagaLabel}
                podeMover={podeMover} aoAbrir={setFicha} aoMudar={recarregar}/>))}
            {itens.length===0 && <div className="text-[11px] text-stone-300 text-center py-7 border border-dashed border-stone-200 rounded-xl">
              {podeMover?"arraste um cartão aqui":"vazio"}</div>}
          </div>
        </div>);
      })}
    </div>

    {ficha && <FichaCandidato cand={ficha} vagas={vagas} onClose={()=>setFicha(null)} onMudou={()=>{setFicha(null);recarregar();}}/>}
    {novo!==null && <FormCandidato vagas={vagas} origens={opcoes("origem",ORIGENS)} gestores={[]}
      etapaInicial={novo} vagaInicial={""} onClose={()=>setNovo(null)} onSalvo={()=>{setNovo(null);recarregar();}}/>}
  </div>);
}

const RECOMENDACOES = [
  {v:"Sim",    rot:"Contratar",  cor:"bg-emerald-600", claro:"bg-emerald-50 text-emerald-700 border-emerald-200"},
  {v:"Talvez", rot:"Em dúvida",  cor:"bg-amber-500",   claro:"bg-amber-50 text-amber-800 border-amber-200"},
  {v:"Nao",    rot:"Não seguir", cor:"bg-red-500",     claro:"bg-red-50 text-red-700 border-red-200"},
];

function Nota({valor, onChange}){
  const rotulos=["Muito abaixo","Abaixo","Atende","Acima","Muito acima"];
  return (<div className="flex gap-1">
    {[1,2,3,4,5].map(n=>(
      <button key={n} type="button" onClick={()=>onChange(valor===n?null:n)}
        title={rotulos[n-1]}
        className={"w-7 h-7 rounded-lg text-[12px] font-semibold transition-all "
          +(valor===n ? "bg-stone-900 text-white shadow-[0_2px_8px_-2px_rgba(28,25,23,.5)]"
           : valor && n<valor ? "bg-stone-200 text-stone-500"
           : "bg-stone-100 text-stone-400 hover:bg-stone-200")}>{n}</button>))}
  </div>);
}

function FormAvaliacao({candidato, onFechar, onSalvo}){
  const criterios = opcoes("criterio_avaliacao",
    ["Experiência na função","Comunicação","Perfil comportamental","Disponibilidade","Aderência à cultura"]);
  const [etapa,setEtapa]=useState(candidato.data_2a_etapa ? "Gestao" : "RH");
  const [notas,setNotas]=useState({});
  const [rec,setRec]=useState(null);
  const [coment,setComent]=useState("");
  const [erro,setErro]=useState("");

  const dadas=Object.values(notas).filter(x=>x);
  const media=dadas.length ? (dadas.reduce((a,b)=>a+b,0)/dadas.length) : null;

  async function salvar(e){
    e.preventDefault(); setErro("");
    if(!dadas.length && !coment.trim()){ setErro("Dê ao menos uma nota ou escreva um comentário."); return; }
    try{
      await sendJSON("/candidatos/"+candidato.id+"/avaliacoes","POST",
                     {etapa, notas, recomendacao:rec, comentario:coment.trim()||null});
      avisar.ok("Avaliação registrada.");
      onSalvo && onSalvo();
      onFechar();
    }catch(err){ setErro(err.message); }
  }

  return (<Modal titulo={"Avaliar entrevista · "+candidato.nome} onClose={onFechar}>
    {erro && <div className="mb-4 flex items-start gap-2.5 rounded-xl bg-red-50 border border-red-100 px-3 py-2.5">
      <span className="mt-[1px] w-4 h-4 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-[11px] font-bold shrink-0">!</span>
      <span className="text-[13px] text-red-700 leading-snug">{erro}</span></div>}

    <form onSubmit={salvar}>
      <div className="flex items-center gap-2 mb-4">
        <span className="t-rotulo">Etapa</span>
        {[["RH","Entrevista do RH"],["Gestao","Entrevista da gestão"]].map(([v,rot])=>(
          <button key={v} type="button" onClick={()=>setEtapa(v)}
            className={"px-3 py-1.5 rounded-lg text-[12.5px] border transition-colors "
              +(etapa===v ? "bg-stone-900 text-white border-stone-900"
                          : "bg-white text-stone-600 border-stone-200 hover:border-stone-300")}>{rot}</button>))}
      </div>

      <div className="space-y-2.5 mb-4">
        {criterios.map(cr=>(
          <div key={cr} className="flex items-center justify-between gap-3">
            <span className="text-[13.5px] text-stone-700 min-w-0 flex-1">{cr}</span>
            <Nota valor={notas[cr]} onChange={n=>setNotas(x=>({...x,[cr]:n}))}/>
          </div>))}
      </div>

      {media!=null && <div className="flex items-center gap-2 mb-4 pb-4 border-b border-stone-100">
        <span className="t-rotulo">Média</span>
        <span className="text-[20px] font-bold text-stone-900 tabular-nums num-destaque">{media.toFixed(1)}</span>
        <span className="t-apoio">de 5 · {dadas.length} de {criterios.length} critérios</span>
      </div>}

      <div className="mb-4">
        <span className="t-rotulo block mb-1.5">Recomendação</span>
        <div className="flex gap-2">
          {RECOMENDACOES.map(r=>(
            <button key={r.v} type="button" onClick={()=>setRec(rec===r.v?null:r.v)}
              className={"flex-1 px-3 py-2 rounded-xl text-[13px] font-semibold border transition-all "

function proximoPasso(c){
  const st=(c.status||"").trim().toUpperCase();
  const dias=c.dias_parado;

  if(ehFinal(st)){
    if(precisaDevolutiva(c))
      return {texto:"Dar devolutiva", porque:"O processo encerrou e a pessoa não foi avisada",
              urgencia:"media", campo:"devolutiva"};
    return null;
  }
  if(!c.data_1a_etapa)
    return {texto:"Marcar entrevista com o RH", porque:"Ainda não tem 1ª etapa agendada",
            urgencia:"media", campo:"data_1a_etapa"};

  const naGestao = st.startsWith("GEST") || /entrevista gest/i.test(c.etapa_atual||"");
  if(naGestao){
    const quem = c.gestor_nome ? `Cobrar parecer de ${c.gestor_nome}` : "Cobrar parecer da gestão";
    return {texto:quem,
            porque: dias!=null ? `Esperando há ${plural(dias,"dia")}` : "Aguardando decisão",
            urgencia:(dias??0)>SLA_DIAS ? "alta" : "baixa", campo:"parecer"};
  }
  if(!c.data_2a_etapa && String(c.parecer||"").trim())
    return {texto:"Marcar entrevista com a gestão", porque:"Parecer do RH já saiu",
            urgencia:"media", campo:"data_2a_etapa"};
  if(!String(c.parecer||"").trim())
    return {texto:"Registrar o parecer do RH", porque:"A 1ª etapa já aconteceu",
            urgencia:(dias??0)>SLA_DIAS ? "alta" : "baixa", campo:"parecer"};
  if(st==="APROVADO" && !c.data_aprovacao)
    return {texto:"Confirmar a data de aprovação", porque:"Aprovado sem data registrada",
            urgencia:"media", campo:"data_aprovacao"};
  return {texto:"Seguir com o processo",
          porque: dias!=null ? `Parado há ${plural(dias,"dia")}` : null,
          urgencia:(dias??0)>SLA_DIAS ? "alta" : "baixa", campo:null};
}

const COR_URGENCIA = {

  media: "bg-amber-50 text-amber-800 border-amber-200",

};

function ProximoPasso({c, completo}){

  entrevista: {sinal:"·", cor:"bg-violet-100 text-violet-700"},

function LinhaDoTempo({candidatoId}){
  const [itens,setItens]=useState(null),[erro,setErro]=useState("");
  const [tudo,setTudo]=useState(false);
  useEffect(()=>{
    getJSON("/candidatos/"+candidatoId+"/historico")
      .then(setItens).catch(e=>setErro(e.message));
  },[candidatoId]);

  if(erro) return <div className="t-apoio">Não foi possível carregar o histórico: {erro}</div>;
  if(!itens) return <div className="t-apoio">carregando...</div>;
  if(!itens.length) return <div className="t-apoio">Nada registrado ainda.</div>;

  const LIMITE=8;
  const visiveis = tudo ? itens : itens.slice(0,LIMITE);
  const quando = q => {
    if(!q) return "";
    const d=new Date(q);
    const hoje=new Date(); hoje.setHours(0,0,0,0);
    const dia=new Date(d); dia.setHours(0,0,0,0);
    const dias=Math.round((hoje-dia)/86400000);
    const rel = dias===0 ? "hoje" : dias===1 ? "ontem" : dias<30 ? `há ${dias} dias` : "";
    const data=d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"});
    return rel ? `${data} · ${rel}` : data;
  };

  return (<div>
    <div className="relative pl-6">
      {}
      <div className="absolute left-[7px] top-2 bottom-2 w-px bg-stone-200"></div>
      {visiveis.map((e,i)=>{
        const ic=ICONE_EVENTO[e.tipo]||ICONE_EVENTO.alteracao;
        return (<div key={i} className="relative pb-3.5 last:pb-0">
          <div className={"absolute -left-6 w-[15px] h-[15px] rounded-full flex items-center justify-center "
                          +"text-[10px] font-bold ring-2 ring-white "+ic.cor}>{ic.sinal}</div>
          <div className="text-[13.5px] text-stone-800 leading-snug">{e.titulo}</div>
          {e.detalhe && <div className="t-apoio mt-0.5 whitespace-pre-line">{e.detalhe}</div>}
          <div className="text-[11.5px] text-stone-400 mt-0.5">
            {quando(e.quando)}{e.quem ? " · "+e.quem : ""}
          </div>
        </div>);
      })}
    </div>
    {itens.length>LIMITE && <button onClick={()=>setTudo(v=>!v)}
      className="mt-2 text-[12.5px] text-stone-500 hover:text-stone-900 underline underline-offset-2">
      {tudo ? "mostrar menos" : `ver os outros ${itens.length-LIMITE}`}</button>}
  </div>);
}

  const setF=v=>{ const novo = typeof v==="function"?v(f):v; setFbruto(novo); setFSalvo(novo); };
  const [novo,setNovo]=useState(false),[editar,setEditar]=useState(null),[ficha,setFicha]=useState(null);

  const gestores=uniq(cands.map(c=>c.gestor_nome)), etapas=uniq([...ETAPAS,...cands.map(c=>c.etapa_atual)]);
  const origens=uniq([...ORIGENS,...cands.map(c=>c.origem)]), statusOpts=uniq([...STATUS_CAND,...cands.map(c=>c.status)]);
  const vagaLabel=id=>{const v=vagas.find(x=>x.id===id); return v?((v.codigo?v.codigo+" · ":"")+v.cargo):"—";};
  const filtrados=cands.filter(c=>{
    if(f.texto){const t=f.texto.toLowerCase(); if(!([c.nome,c.email,c.contato].some(x=>(x||"").toLowerCase().includes(t)))) return false;}
    if(f.status&&(c.status||"")!==f.status) return false;

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">

        <Combo value={f.status} onChange={e=>setF({...f,status:e.target.value})} options={statusOpts} placeholder="Status — todos"/>
        <Combo value={f.vaga_id} onChange={e=>setF({...f,vaga_id:e.target.value})} options={cargosParaFiltro(vagas)} placeholder="Cargo — todos"/>
        <Combo value={f.etapa} onChange={e=>setF({...f,etapa:e.target.value})} options={etapas} placeholder="Etapa — todas"/>
      </div>

      <div className="flex items-center gap-2 flex-wrap mt-3">
        {[["atrasados","Parados +"+SLA_DIAS+" dias"],["semDevolutiva","Esperando devolutiva"]].map(([k,rot])=>(
          <button key={k} onClick={()=>setF({...f,[k]:!f[k]})}
            className={"px-3 py-1.5 rounded-full text-[12.5px] font-medium border transition-colors "
              +(f[k] ? "bg-stone-900 text-white border-stone-900"
                     : "bg-white text-stone-600 border-stone-200 hover:border-stone-300 hover:bg-stone-50")}>
            {rot}</button>))}
        <span className="w-px h-5 bg-stone-200 mx-1"></span>
        <button onClick={()=>setMais(m=>!m)}
          className="px-2.5 py-1.5 rounded-lg text-[12.5px] text-stone-500 hover:text-stone-900 hover:bg-stone-100 transition-colors">
          {mais?"− menos filtros":"+ mais filtros"}
        </button>
      </div>

      {mais && <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3 pt-3 border-t border-stone-100 aparece">
        <Combo value={f.gestor} onChange={e=>setF({...f,gestor:e.target.value})} options={gestores} placeholder="Gestor — todos"/>
        <Combo value={f.origem} onChange={e=>setF({...f,origem:e.target.value})} options={origens} placeholder="Origem — todas"/>
        <label className="block">
          <span className="t-rotulo block mb-1">Entrou a partir de</span>
          <input type="date" value={f.de} onChange={e=>setF({...f,de:e.target.value})} className={inputCls}/>
        </label>
        <label className="block">
          <span className="t-rotulo block mb-1">Entrou até</span>
          <input type="date" value={f.ate} onChange={e=>setF({...f,ate:e.target.value})} className={inputCls}/>
        </label>
      </div>}

      <FiltrosAtivos filtros={f} aoRemover={k=>setF({...f,[k]: typeof f[k]==="boolean"?false:""})} aoLimpar={limparF}
        rotulos={{texto:"Busca",status:"Status",vaga_id:"Cargo",gestor:"Gestor",etapa:"Etapa",origem:"Origem",
                  atrasados:"Parados",semDevolutiva:"Esperando devolutiva",de:"A partir de",ate:"Até"}}
        formatar={{vaga_id:v=>v, de:v=>fmtData(v), ate:v=>fmtData(v)}}/>
    </div>
    <div className="surface overflow-hidden aparece"><div className="overflow-x-auto -mx-px">
      <table className="w-full text-sm tabela">
        <thead className="text-stone-400 border-b border-stone-100"><tr>
          <th className="w-10 pl-4 pr-1 py-2.5">
            <Caixa marcada={listados.length>0 && listados.every(x=>sel.has(x.id))}
                   parcial={listados.some(x=>sel.has(x.id))}
                   titulo="Marcar todos os filtrados"
                   onChange={e=>setSel(e.target.checked ? new Set(listados.map(x=>x.id)) : new Set())}/>
          </th>
          {[["Candidato","nome"],["Vaga","cargo"],["Etapa","etapa_atual"],["Status","status"],
            ["Devolutiva","devolutiva"],["Gestor","gestor_nome"],["Parado","dias_parado"],
            ["Próximo passo",null],["",null]]
            .map(([rot,campo])=><Th key={rot||"acoes"} rotulo={rot} campo={campo} ord={ord} alternar={alternar}/>)}
        </tr></thead>
        <tbody>
          {filtrados.length===0 && <tr><td colSpan="10"><Vazio icone="candidatos" titulo="Nenhum candidato com esses filtros" texto="Tente remover algum filtro acima, ou use a busca (Ctrl K) para achar alguém pelo nome."/></td></tr>}
          {listados.map(c=>(<tr key={c.id} className="border-t border-stone-50 row-hover cursor-pointer" onClick={aoClicar(()=>setFicha(c))}>
            <td className="w-10 pl-4 pr-1 py-2.5" onClick={e=>e.stopPropagation()}>
              <Caixa marcada={sel.has(c.id)} onChange={e=>marcar(c.id,e.target.checked)}/>
            </td>
            <td className="px-4 py-2.5"><div className="flex items-center gap-2"><Avatar nome={c.nome}/><span className="font-medium text-stone-700">{c.nome}</span></div></td>
            <td className="px-4 py-2.5">{vagaLabel(c.vaga_id)}</td>
            <td className="px-4 py-2.5">{c.etapa_atual||"—"}</td>
            <td className="px-4 py-2.5"><Tag texto={c.status||"em processo"} cor={corStatus(c.status)}/></td>
            <td className="px-4 py-2.5">{temDevolutiva(c)
              ? <Tag texto="dada" cor="bg-emerald-100 text-emerald-700" suave/>
              : precisaDevolutiva(c) ? <Tag texto="pendente" cor="bg-red-100 text-red-700"/>
              : <span className="t-apoio">dispensa</span>}</td>
            <td className="px-4 py-2.5">{c.gestor_nome||"—"}</td>
            <td className="px-4 py-2.5">{(c.dias_parado!=null&&!ehFinal(c.status))
              ? (c.dias_parado>SLA_DIAS
                  ? <Tag texto={c.dias_parado+"d"} cor="bg-red-100 text-red-700"/>
                  : <span className="t-apoio num">{c.dias_parado}d</span>)
              : <span className="text-stone-300">—</span>}</td>
            <td className="px-4 py-2.5"><ProximoPasso c={c}/></td>
            <td className="px-4 py-2.5 text-right whitespace-nowrap" onClick={e=>e.stopPropagation()}>
              {(pode("candidatos.editar")||pode("candidatos.parecer")) && <>
                <button onClick={()=>setEditar(c)}
                  className="px-2.5 py-1 text-[12.5px] rounded-lg ring-1 ring-stone-200 hover:bg-stone-50 mr-1">editar</button>
                <AcoesRapidas cand={c} aoMudar={recarregar}/>
              </>}
            </td>
          </tr>))}
        </tbody>
      </table>
    </div></div>

    <BarraLote qtd={sel.size} onLimpar={()=>setSel(new Set())}>
      {pode("candidatos.editar") && <AcaoLote onClick={async()=>{
        const alvos=cands.filter(x=>sel.has(x.id));
        const valido=await escolher({titulo:"Novo status", texto:"Vale para os "+alvos.length+" candidatos selecionados.", opcoes:statusOpts});
        if(!valido) return;
        if(!await confirmar({titulo:"Mudar o status de "+alvos.length+" candidato(s) para \""+valido+"\"?",
                             texto:"A etapa do funil é ajustada automaticamente, igual à planilha.", confirmar:"Mudar status", perigo:false})) return;
        try{ await emLote(alvos, x=>sendJSON("/candidatos/"+x.id,"PATCH",{status:valido, versao:x.versao}), "Mudando status"); }
        catch(e){ avisar.erro(e.message); }
        setSel(new Set()); recarregar();
      }}>Mudar status</AcaoLote>}

      {pode("candidatos.editar") && <AcaoLote onClick={async()=>{
        const alvos=cands.filter(x=>sel.has(x.id) && precisaDevolutiva(x));
        if(!alvos.length){ avisar.info("Nenhum dos selecionados está esperando devolutiva."); return; }
        if(!await confirmar({titulo:"Marcar devolutiva dada para "+alvos.length+" candidato(s)?",
                             texto:"Registra \"OK\" no campo devolutiva. Use quando já tiver dado o retorno.",
                             confirmar:"Marcar como dada", perigo:false})) return;
        try{ await emLote(alvos, x=>sendJSON("/candidatos/"+x.id,"PATCH",{devolutiva:"OK", versao:x.versao}), "Marcando devolutiva"); }
        catch(e){ avisar.erro(e.message); }
        setSel(new Set()); recarregar();
      }}>Devolutiva dada</AcaoLote>}

      {pode("candidatos.editar") && <AcaoLote onClick={async()=>{
        const alvos=cands.filter(x=>sel.has(x.id) && !x.banco_talentos);
        if(!alvos.length){ avisar.info("Os selecionados já estão no banco de talentos."); return; }
        if(!await confirmar({titulo:"Mandar "+alvos.length+" para o banco de talentos?",
                             texto:"Ficam guardados para futuras aberturas do mesmo cargo.", confirmar:"Mandar", perigo:false})) return;
        try{ await emLote(alvos, x=>sendJSON("/candidatos/"+x.id,"PATCH",{banco_talentos:true, versao:x.versao}), "Enviando ao banco"); }
        catch(e){ avisar.erro(e.message); }
        setSel(new Set()); recarregar();
      }}>Banco de talentos</AcaoLote>}

      {pode("relatorios.exportar") && <AcaoLote onClick={()=>{
        const alvos=listados.filter(x=>sel.has(x.id));
        const cols=["nome","cargo","etapa_atual","status","origem","gestor_nome","contato","email","dias_parado"];
        const linhas=[cols.join(";")].concat(alvos.map(x=>cols.map(k=>`"${(x[k]??"").toString().replace(/"/g,'""')}"`).join(";")));
        const blob=new Blob(["\ufeff"+linhas.join("\n")],{type:"text/csv;charset=utf-8"});
        const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="candidatos_selecionados.csv"; a.click();
        avisar.ok(alvos.length+" candidato(s) exportado(s).");
      }}>Exportar</AcaoLote>}
    </BarraLote>

    {novo && <FormCandidato vagas={vagas} origens={origens} gestores={gestores} onClose={()=>setNovo(false)} onSalvo={()=>{setNovo(false);recarregar();}}/>}
    {editar && <FormCandidato cand={editar} vagas={vagas} origens={origens} gestores={gestores} onClose={()=>setEditar(null)} onSalvo={()=>{setEditar(null);recarregar();}}/>}
    {ficha && <FichaCandidato cand={ficha} vagas={vagas} onClose={()=>setFicha(null)} onMudou={()=>{setFicha(null);recarregar();}}/>}
  </div>);
}

function FormCandidato({cand, vagas, origens, gestores, onClose, onSalvo, etapaInicial, vagaInicial}){
  const ed=!!cand;
  const [d,setD]=useState({
    nome:cand?.nome||"", vaga_id:cand?.vaga_id||"", contato:cand?.contato||"", email:cand?.email||"",
    cpf:cand?.cpf||"", origem:cand?.origem||"", gestor_nome:cand?.gestor_nome||"",
    etapa_atual:cand?.etapa_atual||etapaInicial||(ed?"":"1. Recebido"), status:cand?.status||"", parecer:cand?.parecer||"",
    disc:cand?.disc||"", devolutiva:cand?.devolutiva||"", data_1a_etapa:(cand?.data_1a_etapa||"").slice(0,10),
    hora_1a_etapa:cand?.hora_1a_etapa||"", data_2a_etapa:(cand?.data_2a_etapa||"").slice(0,10), hora_2a_etapa:cand?.hora_2a_etapa||"", linha:cand?.linha||"",
    consulta:cand?.consulta||"", chek:cand?.chek||"", reagendado:cand?.reagendado||"", reagendamento:cand?.reagendamento||"", extras:cand?.extras||{},
    observacoes:cand?.observacoes||""});
  const [erro,setErro]=useState(""),[salv,setSalv]=useState(false),[pend,setPend]=useState(null);
  const [dup,setDup]=useState(null),[conflito,setConflito]=useState(false);
  const set=k=>e=>setD({...d,[k]:e.target.value});
  function corpo(op){
    const b=limpo({...d, vaga_id:d.vaga_id?parseInt(d.vaga_id):""});
    if(!ed && !b.etapa_atual) b.etapa_atual="1. Recebido";
    if(op&&op.pendencias) b.confirmar_pendencias=true;
    if(op&&op.duplicado)  b.confirmar_duplicado=true;
    if(ed) b.versao = cand.versao;
    return b;
  }
  async function gravar(op){
    if(salv) return;
    setErro(""); setSalv(true);
    try{ if(ed) await sendJSON("/candidatos/"+cand.id,"PATCH",corpo(op));
         else await sendJSON("/candidatos","POST",corpo(op));
         avisar.ok(ed ? d.nome+" foi atualizado." : d.nome+" foi cadastrado.");
         onSalvo();
    }catch(err){
      if(err.pendencias) setPend(err.pendencias);
      else if(err.duplicados) setDup(err.duplicados);
      else if(err.conflito) setConflito(true);
      else setErro(err.message);
      setSalv(false);
    }
  }
  async function salvar(e){ e.preventDefault(); gravar(null); }
  if(conflito) return (<Modal titulo="Outra pessoa alterou este candidato" onClose={onClose}>
    <div className="text-sm text-stone-600 mb-4">
      <p className="mb-2">Enquanto você editava, alguém salvou uma alteração em <b>{cand?.nome}</b>.</p>
      <p>Para não apagar o trabalho da outra pessoa, o sistema não gravou.
         Feche e abra de novo para ver a versão atual.</p>
    </div>
    <div className="flex justify-end gap-2"><Botao onClick={onSalvo}>Recarregar</Botao></div>
  </Modal>);
  if(dup) return <AvisoDuplicado titulo="Este candidato já existe?" encontrados={dup}
      processando={salv}
      onCriarMesmoAssim={()=>{ setDup(null); gravar({duplicado:true}); }}
      onCancelar={()=>{ setDup(null); setSalv(false); }}/>;
  if(pend) return <AvisoPendencias titulo="Aprovar sem estas informações?" pendencias={pend}
      processando={salv}
      onPreencher={()=>setPend(null)}
      onConfirmar={()=>{ setPend(null); gravar({pendencias:true, duplicado:true}); }}
      onCancelar={()=>{ setPend(null); setSalv(false); }}/>;
  return (<Modal wide titulo={ed?("Editar — "+cand.nome):"Novo candidato"} onClose={onClose}>
    {erro && <div className="mb-3 text-sm text-red-600 bg-red-50 border border-red-200 rounded p-2">{erro}</div>}
    <form onSubmit={salvar}><div className="grid grid-cols-1 sm:grid-cols-2 gap-x-5">
      <Campo label="Nome *"><Texto value={d.nome} onChange={set("nome")} required/></Campo>
      <Campo label="Vaga"><Combo value={d.vaga_id} onChange={set("vaga_id")}
        options={aberturasParaEscolher(vagas, d.vaga_id)} placeholder="— selecione a vaga —"/></Campo>
      <Campo label="Telefone"><Texto value={d.contato} onChange={set("contato")}/></Campo>
      <Campo label="E-mail"><Texto type="email" value={d.email} onChange={set("email")}/></Campo>
      <Campo label="CPF"><Texto value={d.cpf} onChange={set("cpf")}/></Campo>
      <Campo label="Origem"><Combo value={d.origem} onChange={set("origem")} options={origens} placeholder="— selecione —"/></Campo>
      <Campo label="Gestor"><Texto value={d.gestor_nome} onChange={set("gestor_nome")} list="lst-gest"/><datalist id="lst-gest">{(gestores||[]).map(g=><option key={g} value={g}/>)}</datalist></Campo>
      <Campo label="Data 1ª etapa (RH)"><input type="date" value={d.data_1a_etapa} onChange={set("data_1a_etapa")} className={inputCls}/></Campo>
      <Campo label="Hora 1ª etapa"><input type="time" value={d.hora_1a_etapa} onChange={set("hora_1a_etapa")} className={inputCls}/></Campo>
      <Campo label="Data 2ª etapa (Gestão)"><input type="date" value={d.data_2a_etapa} onChange={set("data_2a_etapa")} className={inputCls}/></Campo>
      <Campo label="Hora 2ª etapa"><input type="time" value={d.hora_2a_etapa} onChange={set("hora_2a_etapa")} className={inputCls}/></Campo>
      <Campo label="Etapa atual" ajuda="etapa"><Combo value={d.etapa_atual} onChange={set("etapa_atual")} options={opcoes("etapa",ETAPAS)} placeholder="— selecione —"/></Campo>
      <Campo label="Status"><Combo value={d.status} onChange={set("status")} options={opcoes("status_candidato",STATUS_TODOS)} placeholder="— selecione —"/></Campo>
      <Campo label="Linha (Vendedor/SDR)" ajuda="linha"><Combo value={d.linha} onChange={set("linha")} options={opcoes("linha",LINHAS)} placeholder="— não se aplica —"/></Campo>
      <Campo label="DISC" ajuda="disc"><Combo value={d.disc} onChange={set("disc")} options={OKNAO} placeholder="—"/></Campo>
      <Campo label="Devolutiva" ajuda="devolutiva"><Combo value={d.devolutiva} onChange={set("devolutiva")} options={OKNAO} placeholder="—"/></Campo>
      <Campo label="Consulta" ajuda="consulta"><Combo value={d.consulta} onChange={set("consulta")} options={OKNAO} placeholder="—"/></Campo>
      <Campo label="Check" ajuda="chek"><Combo value={d.chek} onChange={set("chek")} options={OKNAO} placeholder="—"/></Campo>
      <Campo label="Reagendado?" ajuda="reagendado"><Combo value={d.reagendado} onChange={set("reagendado")} options={opcoes("reagendado",REAGENDADO)} placeholder="—"/></Campo>
      <Campo label="Data/hora do reagendamento"><Texto value={d.reagendamento} onChange={set("reagendamento")} placeholder="11/03/2026 16h"/></Campo>
    </div>
      <CamposExtras entidade="candidato" valores={d.extras} onChange={ex=>setD({...d,extras:ex})}/>
      <Campo label="Parecer" ajuda="parecer"><Texto value={d.parecer} onChange={set("parecer")}/></Campo>
      <Campo label="Observações"><textarea value={d.observacoes} onChange={set("observacoes")} rows="2" className={inputCls}></textarea></Campo>
      <div className="flex justify-end gap-2 mt-3"><Botao tipo="claro" onClick={onClose}>Cancelar</Botao><Botao submit carregando={salv}>{salv?"Salvando...":(ed?"Salvar":"Cadastrar")}</Botao></div>
    </form>
  </Modal>);
}

function FichaVaga({vaga, cands, gestores, todasVagas, onClose, onEditar, onReabrir, onVincular, onExcluida}){
  const v=vaga; const [reab,setReab]=useState(false);
  const norm=x=>(x||"").toLowerCase().trim();
  const alvo=norm(cargoDe(v));
  const combina=c=>{ const cc=norm(c.cargo); if(!cc||!alvo) return false;
    return cc===alvo || cc.includes(alvo) || alvo.includes(cc); };
  const hist=(todasVagas||[]).filter(x=>norm(cargoDe(x))===alvo && x.data_abertura)
      .sort((a,b)=>String(b.data_abertura).localeCompare(String(a.data_abertura)));
  let intervalo=null, proxima=null;
  if(hist.length>1){
    const datas=[...new Set(hist.map(x=>String(x.data_abertura).slice(0,10)))].sort();
    const gaps=[]; for(let i=1;i<datas.length;i++){const g=diasEntre(datas[i-1],datas[i]); if(g>0)gaps.push(g);}
    if(gaps.length){ intervalo=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);
      const u=new Date(datas[datas.length-1]+"T00:00:00"); u.setDate(u.getDate()+intervalo);
      proxima=u.toISOString().slice(0,10); }
  }
  const sugeridos=cands.filter(c=> c.vaga_id!==v.id && combina(c)
      && (c.banco_talentos || (ehFinal(c.status) && RETOMAR_RX.test(c.observacoes||"")))
      && (!v.linha || !c.linha || c.linha===v.linha || v.linha==="Ambas" || c.linha==="Ambas"));
  const doVaga=cands.filter(c=>c.vaga_id===v.id);
  const up=s=>(s||"").toUpperCase();
  const recebidos=doVaga.length, triados=doVaga.filter(c=>c.contato_inicial).length;
  const rh=doVaga.filter(c=>c.data_1a_etapa).length, gest=doVaga.filter(c=>c.data_2a_etapa).length;
  const aprov=doVaga.filter(c=>up(c.status)==="APROVADO").length;
  const etapas=[["Recebidos",recebidos],["Contatados",triados],["Entrev. RH",rh],["Entrev. Gestão",gest],["Aprovados",aprov]];
  const hoje=new Date();
  const diasAberto = v.data_abertura ? diasEntre(v.data_abertura, v.data_fechamento||hoje.toISOString().slice(0,10)) : null;
  const sla = aprov>0 ? diasEntre(v.data_abertura, doVaga.filter(c=>c.data_aprovacao).map(c=>c.data_aprovacao).sort()[0]) : null;
  const restante = Math.max(0,(v.qtde||1)-aprov);
  const nomeGestor=(gestores.find(g=>g.id===v.gestor_id)||{}).nome||"—";
  const item=(l,x,span=1)=>(<div className={"min-w-0 "+(span===2?"sm:col-span-2":"")}><dt>{l}</dt><dd title={x||""}>{x||<span className="text-stone-300">—</span>}</dd></div>);
  return (<Modal wide titulo={"Vaga — "+cargoDe(v)} onClose={onClose}>
    <div className="flex items-center gap-3 mb-4">
      <div className="w-11 h-11 rounded-xl bg-stone-100 text-stone-600 flex items-center justify-center"><Icon name="vagas"/></div>
      <div className="flex-1"><div className="text-lg font-semibold text-stone-800">{v.cargo} {v.nivel && <span className="text-stone-400 text-sm">· {v.nivel}</span>}</div>
        <div className="text-sm text-stone-500 font-mono">{v.codigo||"sem código"}</div></div>
      <Tag texto={v.status||"—"} cor={v.status==="FECHADA"?"bg-stone-200 text-stone-600":"bg-sky-100 text-sky-700"}/>
    </div>
    <dl className="dl grid grid-cols-2 sm:grid-cols-4 gap-x-5 gap-y-4 mb-6">
      {item("Gestor",nomeGestor)}{item("Área",v.area,2)}{item("Tipo",v.tipo)}
      {item("Motivo",v.motivo)}
      {item("Salário",v.salario?("R$ "+Number(v.salario).toLocaleString("pt-BR")):null)}
      {item("Abertura",fmtData(v.data_abertura))}{item("Previsão início",fmtData(v.previsao_inicio))}
      {item("Fechamento",fmtData(v.data_fechamento))}
      {item("Dias em aberto",diasAberto!=null?plural(diasAberto,"dia"):null,2)}
    </dl>
    <div className="grid grid-cols-3 gap-3 mb-5">
      <div className="bg-stone-50 rounded-xl p-3 text-center"><div className="text-xs text-stone-500">Vagas</div><div className="text-2xl font-bold text-stone-800">{v.qtde||1}</div></div>
      <div className="bg-emerald-50 rounded-lg p-3 text-center"><div className="text-xs text-emerald-600">Preenchidas</div><div className="text-2xl font-bold text-emerald-700">{aprov}</div></div>
      <div className="bg-amber-50 rounded-lg p-3 text-center"><div className="text-xs text-amber-600">Restam</div><div className="text-2xl font-bold text-amber-700">{restante}</div></div>
    </div>
    <ExtrasFicha entidade="vaga" valores={v.extras}/>
    <div className="text-sm font-semibold text-stone-600 mb-2">Funil desta vaga {sla!=null && <span className="font-normal text-stone-400">· SLA até 1ª aprovação: {sla} dias</span>}</div>

function FormVaga({vaga, gestores, onClose, onSalvo}){
  const ed=!!vaga;
  const [d,setD]=useState({codigo:vaga?.codigo||"", cargo:vaga?.cargo||"", cargo_padrao:vaga?.cargo_padrao||"", nivel:vaga?.nivel||"", qtde:vaga?.qtde||1,
    tipo:vaga?.tipo||"", motivo:vaga?.motivo||"", salario:vaga?.salario||"", area:vaga?.area||"", linha:vaga?.linha||"", rank:vaga?.rank||"", status:vaga?.status||"ABERTURA",
    gestor_id:vaga?.gestor_id||"", data_abertura:(vaga?.data_abertura||"").slice(0,10),
    previsao_inicio:(vaga?.previsao_inicio||"").slice(0,10), data_fechamento:(vaga?.data_fechamento||"").slice(0,10), observacoes:vaga?.observacoes||"", extras:vaga?.extras||{}});
  const [erro,setErro]=useState(""),[salv,setSalv]=useState(false),[pend,setPend]=useState(null);
  const [dup,setDup]=useState(null),[conflito,setConflito]=useState(false);
  const set=k=>e=>setD({...d,[k]:e.target.value});
  function corpo(op){ const b=limpo({...d, qtde:parseInt(d.qtde)||1,
      salario:d.salario?parseFloat(d.salario):"", rank:d.rank?parseInt(d.rank):"",
      gestor_id:d.gestor_id?parseInt(d.gestor_id):""});
    if(op&&op.pendencias) b.confirmar_pendencias=true;
    if(op&&op.duplicado)  b.confirmar_duplicado=true;
    if(ed) b.versao = vaga.versao;
    return b; }
  async function gravar(op){
    if(salv) return;
    setErro(""); setSalv(true);
    try{ if(ed) await sendJSON("/vagas/"+vaga.id,"PATCH",corpo(op));
         else await sendJSON("/vagas","POST",corpo(op));
         avisar.ok(ed ? "Vaga atualizada." : "Vaga criada.");
         onSalvo();
    }catch(err){
      if(err.pendencias) setPend(err.pendencias);
      else if(err.duplicados) setDup(err.duplicados);
      else if(err.conflito) setConflito(true);
      else setErro(err.message);
      setSalv(false);
    }
  }
  async function salvar(e){ e.preventDefault(); gravar(null); }
  if(conflito) return (<Modal titulo="Outra pessoa alterou esta vaga" onClose={onClose}>
    <div className="text-sm text-stone-600 mb-4">
      <p className="mb-2">Enquanto você editava, alguém salvou uma alteração nesta vaga.</p>
      <p>Para não apagar o trabalho da outra pessoa, o sistema não gravou.
         Feche e abra de novo para ver a versão atual.</p></div>
    <div className="flex justify-end gap-2"><Botao onClick={onSalvo}>Recarregar</Botao></div>
  </Modal>);

  useEffect(()=>{ recarregar(); getJSON("/candidatos").then(setCands).catch(()=>{}); getJSON("/vagas").then(setVagas).catch(()=>{}); },[]);
  if(erro) return <Erro msg={erro}/>; if(!canais) return <Esqueleto linhas={5} tipo="lista"/>;

    const recebidas=recs.filter(r=>r.canal_id===c.id).reduce((a,r)=>a+(r.quantidade||0),0);

    return {c, entraram:daOrigem.length, aprov, recebidas,
            conv: base? aprov/base : 0, aproveit: recebidas? daOrigem.length/recebidas : null};
  }).sort((a,b)=> b.aprov-a.aprov || b.entraram-a.entraram);

      <KPI titulo="Entraram no processo" valor={totEnt} icon="funil" cor="text-amber-700" bg="bg-amber-50"/>

    <div className="surface overflow-hidden aparece"><div className="overflow-x-auto -mx-px">

          {linhas.map(({c,entraram,aprov,recebidas,conv})=>(
