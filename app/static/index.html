function MeuPerfil({onFechar, onAtualizado}){
  const [me,setMe]=useState(null),[erro,setErro]=useState(""),[msg,setMsg]=useState(""),[salv,setSalv]=useState(false);
  const [nome,setNome]=useState(""),[foto,setFoto]=useState("");
  const [sAtual,setSAtual]=useState(""),[sNova,setSNova]=useState(""),[sConf,setSConf]=useState("");
  useEffect(()=>{ getJSON("/auth/me").then(d=>{ setMe(d); setNome(d.nome||""); setFoto(d.foto||""); }).catch(e=>setErro(e.message)); },[]);
  if(erro) return <Modal titulo="Meu perfil" onClose={onFechar}><Erro msg={erro}/></Modal>;
  if(!me) return <Modal titulo="Meu perfil" onClose={onFechar}><Carregando/></Modal>;

  function escolherFoto(e){
    const arq=e.target.files && e.target.files[0]; if(!arq) return;
    if(!/^image\//.test(arq.type)){ avisar.erro("Escolha um arquivo de imagem."); return; }
    if(arq.size > 3*1024*1024){ avisar.erro("Imagem muito grande. Use uma foto de ate 3 MB."); return; }
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const lado=Math.min(img.width,img.height), c=document.createElement("canvas");
        c.width=c.height=256;
        const ctx=c.getContext("2d");
        ctx.drawImage(img,(img.width-lado)/2,(img.height-lado)/2,lado,lado,0,0,256,256);
        setFoto(c.toDataURL("image/jpeg",0.85));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(arq);
  }

  async function salvar(){
    setErro(""); setMsg(""); setSalv(true);
    const corpo={nome, foto};
    if(sNova){
      if(sNova!==sConf){ setErro("A confirmação da nova senha não confere."); setSalv(false); return; }
      corpo.senha_atual=sAtual; corpo.senha_nova=sNova;
    }
    try{
      const d=await sendJSON("/auth/perfil","PATCH",corpo);
      S.setNome(d.nome); S.setFoto(d.foto);
      setSAtual(""); setSNova(""); setSConf("");
      setMsg("Perfil atualizado."); onAtualizado && onAtualizado();
    }catch(e){ setErro(e.message); }
    finally{ setSalv(false); }
  }

  return (<Modal titulo="Meu perfil" onClose={onFechar}>
    {erro && <div className="mb-3 text-sm text-red-600 bg-red-50 border border-red-200 rounded p-2">{erro}</div>}
    {msg && <div className="mb-3 text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded p-2">{msg}</div>}

    <div className="flex items-center gap-4 mb-5">
      <Avatar nome={nome} foto={foto} cls="w-20 h-20 text-2xl"/>
      <div className="flex-1">
        <label className="inline-block">
          <span className="inline-flex items-center gap-1.5 px-3 py-1.5 text-[12.5px] rounded-lg bg-white ring-1 ring-stone-200 hover:bg-stone-50 cursor-pointer font-semibold">
            {foto?"Trocar foto":"Escolher foto"}</span>
          <input type="file" accept="image/*" onChange={escolherFoto} className="hidden"/>
        </label>
        {foto && <button onClick={()=>setFoto("")} className="px-2 py-1 rounded-lg text-[12.5px] text-stone-400 hover:text-red-600 hover:bg-red-50 transition-colors">remover</button>}
        <div className="text-[11px] text-stone-400 mt-1.5">A imagem é reduzida automaticamente.</div>
      </div>
    </div>

    <Campo label="Nome"><Texto value={nome} onChange={e=>setNome(e.target.value)}/></Campo>
    <div className="grid grid-cols-2 gap-x-4 mb-1">
      <div><div className="text-xs text-stone-400">E-mail (login)</div><div className="text-sm text-stone-600 mb-3">{me.email}</div></div>
      <div><div className="text-xs text-stone-400">Função</div><div className="text-sm text-stone-600 mb-3">{me.perfil}</div></div>
    </div>

    <div className="border-t border-stone-100 pt-4 mt-2">
      <div className="text-sm font-semibold text-stone-700 mb-3">Trocar senha <span className="font-normal text-stone-400">(opcional)</span></div>
      <Campo label="Senha atual"><Texto type="password" value={sAtual} onChange={e=>setSAtual(e.target.value)}/></Campo>
      <div className="grid grid-cols-2 gap-x-4">
        <Campo label="Nova senha"><Texto type="password" value={sNova} onChange={e=>setSNova(e.target.value)}/></Campo>
        <Campo label="Repita a nova senha"><Texto type="password" value={sConf} onChange={e=>setSConf(e.target.value)}/></Campo>
      </div>
    </div>

    <div className="flex justify-end gap-2 mt-4">
      <Botao tipo="claro" onClick={onFechar}>Fechar</Botao>
      <Botao onClick={salvar} disabled={salv}>{salv?"Salvando...":"Salvar"}</Botao>
    </div>
  </Modal>);
}

function FichaRequisicao({req,gestores,onClose,onMudou}){

      <Tag texto={req.status} cor={req.status==="APROVADA"?"bg-emerald-100 text-emerald-700":req.status==="RECUSADA"?"bg-red-100 text-red-700":"bg-amber-100 text-amber-800"}/>

      {item("Área",req.area)}{item("Linha",req.linha)}{item("Gestor",nomeGestor)}
      {item("Salário",req.salario?("R$ "+Number(req.salario).toLocaleString("pt-BR")):null)}

      {item("Previsão de início",fmtData(req.previsao_inicio),2)}

    {req.justificativa && <div className="bg-stone-50 rounded-xl p-3 text-sm text-stone-600 mb-4">
      <b>Justificativa:</b> {req.justificativa}</div>}
    {req.status!=="PENDENTE" && <div className="bg-stone-50 rounded-xl p-3 text-sm text-stone-600 mb-4">
      <b>{req.status==="APROVADA"?"Aprovada":"Recusada"}</b> por {req.decidido_por} em {fmtData(req.decidido_em)}
      {req.observacao_decisao?" — "+req.observacao_decisao:""}
      {req.vaga_id && <div className="text-emerald-700 mt-1">Vaga criada no sistema.</div>}</div>}
    {req.status==="PENDENTE" && pode("requisicoes.aprovar") && <>
      <Campo label="Observação da decisão (opcional)"><Texto value={obs} onChange={e=>setObs(e.target.value)}/></Campo>
      <div className="flex justify-end gap-2 mt-3">
        <Botao tipo="claro" onClick={onClose}>Fechar</Botao>
        <Botao tipo="vermelho" onClick={()=>decidir(false)}>{proc?"...":"Recusar"}</Botao>
        <Botao tipo="verde" onClick={()=>decidir(true)}>{proc?"...":"Aprovar e abrir vaga"}</Botao>
      </div></>}

function Configuracoes(){
  const [secao,setSecao]=useState("listas");
  const [itens,setItens]=useState(null),[meta,setMeta]=useState({rotulos:{},sensiveis:[]}),[erro,setErro]=useState("");
  const [tipo,setTipo]=useState(""),[novoValor,setNovoValor]=useState(""),[editando,setEditando]=useState(null),[texto,setTexto]=useState("");
  function recarregar(){
    getJSON("/listas/todos").then(d=>{ setItens(d); if(!tipo && d.length) setTipo(d[0].tipo); }).catch(e=>setErro(e.message));
    getJSON("/listas").then(d=>{ setMeta({rotulos:d.rotulos||{},sensiveis:d.sensiveis||[]}); LISTAS_API=d.listas||{}; }).catch(()=>{});
  }
  useEffect(()=>{ recarregar(); },[]);
  if(erro) return <Erro msg={erro}/>; if(!itens) return <Carregando/>;
  const tipos=[...new Set(itens.map(i=>i.tipo))];
  const doTipo=itens.filter(i=>i.tipo===tipo).sort((a,b)=>a.ordem-b.ordem||a.valor.localeCompare(b.valor));
  const sensivel=meta.sensiveis.includes(tipo);

  async function adicionar(e){ e.preventDefault(); if(!novoValor.trim())return;
    try{ await sendJSON("/listas","POST",{tipo,valor:novoValor.trim(),ordem:doTipo.length}); setNovoValor(""); recarregar(); }
    catch(err){ avisar.erro(err.message); } }
  async function salvarEdicao(item){
    if(!texto.trim()||texto===item.valor){ setEditando(null); return; }
    if(sensivel && !await confirmar({titulo:"Esta lista é usada pela lógica do sistema", texto:"Renomear vai atualizar também os registros que usam \""+item.valor+"\".", confirmar:"Renomear assim mesmo", perigo:false})){ setEditando(null); return; }
    try{ await sendJSON("/listas/"+item.id,"PATCH",{valor:texto.trim()}); setEditando(null); recarregar(); }
    catch(err){ avisar.erro(err.message); } }
  async function alternar(item){
    try{ await sendJSON("/listas/"+item.id,"PATCH",{ativo:!item.ativo}); recarregar(); }catch(e){ avisar.erro(e.message); } }
  async function excluir(item){
    if(!await confirmar({titulo:"Excluir \""+item.valor+"\" da lista?", texto:"Registros antigos que usam esse valor continuam como estão.", confirmar:"Excluir"})) return;
    try{ await api("/listas/"+item.id,{method:"DELETE"}); recarregar(); }catch(e){ avisar.erro(e.message); } }
  async function mover(item,dir){
    const idx=doTipo.findIndex(x=>x.id===item.id), alvo=doTipo[idx+dir];
    if(!alvo) return;
    try{ await sendJSON("/listas/"+item.id,"PATCH",{ordem:alvo.ordem});
         await sendJSON("/listas/"+alvo.id,"PATCH",{ordem:item.ordem}); recarregar(); }catch(e){ avisar.erro(e.message); } }

  return (<div>
    <Cabecalho titulo="Configurações" descricao="Adapte o sistema sem precisar de programador."/>
    <div className="flex gap-2 mb-5 flex-wrap">
      {[["listas","Listas"],["gestores","Cargo → Gestor"],["campos","Campos personalizados"],["email","E-mail e mensagens"]].map(([id,lb])=>
        <ChipPeriodo key={id} ativo={secao===id} onClick={()=>setSecao(id)}>{lb}</ChipPeriodo>)}
    </div>
    {secao==="gestores" && <MapaGestores/>}
    {secao==="campos" && <CamposPersonalizados/>}
    {secao==="email" && <ConfigEmail/>}
    {secao==="listas" && <>
    <div className="grid grid-cols-1 lg:grid-cols-4 gap-5">
      <div className="lg:col-span-1">
        <div className="surface p-2">
          {tipos.map(t=>(<button key={t} onClick={()=>{setTipo(t);setEditando(null);}}
            className={"w-full text-left px-3 py-2 rounded-xl text-[12.5px] mb-0.5 transition "+(tipo===t?"bg-stone-900 text-white font-medium":"hover:bg-stone-50 text-stone-600")}>
            {meta.rotulos[t]||t}
            <span className={"float-right text-[11px] "+(tipo===t?"text-white/60":"text-stone-400")}>{itens.filter(i=>i.tipo===t).length}</span>
          </button>))}
        </div>
      </div>
      <div className="lg:col-span-3">
        <div className="surface overflow-hidden">
          <div className="px-5 py-4 border-b border-stone-100">
            <div className="font-semibold text-stone-800">{meta.rotulos[tipo]||tipo}</div>
            {sensivel && <div className="text-[12.5px] text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-2 mt-2">
              Esta lista é usada pela lógica do sistema (funil e situação do candidato). Ao renomear, os registros são atualizados junto.</div>}
          </div>
          <form onSubmit={adicionar} className="flex gap-2 px-5 py-3 border-b border-stone-100">
            <Texto value={novoValor} onChange={e=>setNovoValor(e.target.value)} placeholder={"Novo item em "+(meta.rotulos[tipo]||tipo).toLowerCase()}/>
            <Botao submit small>Adicionar</Botao>
          </form>
          <div className="divide-y divide-stone-100 max-h-[52vh] overflow-auto">
            {doTipo.length===0 && <div className="px-5 py-8 text-center text-stone-400 text-sm">Lista vazia.</div>}
            {doTipo.map((item,i)=>(
              <div key={item.id} className={"flex items-center gap-2 px-5 py-2.5 "+(item.ativo?"":"opacity-50")}>
                <div className="flex flex-col leading-none">
                  <button onClick={()=>mover(item,-1)} disabled={i===0} className="text-stone-300 hover:text-stone-700 disabled:opacity-30 text-[11px]">▲</button>
                  <button onClick={()=>mover(item,1)} disabled={i===doTipo.length-1} className="text-stone-300 hover:text-stone-700 disabled:opacity-30 text-[11px]">▼</button>
                </div>
                {editando===item.id
                  ? <input autoFocus value={texto} onChange={e=>setTexto(e.target.value)}
                      onBlur={()=>salvarEdicao(item)} onKeyDown={e=>{if(e.key==="Enter")salvarEdicao(item); if(e.key==="Escape")setEditando(null);}}
                      className={inputCls+" flex-1"}/>
                  : <span onClick={()=>{setEditando(item.id);setTexto(item.valor);}}
                      className="flex-1 text-sm text-stone-700 cursor-text hover:text-stone-900">{item.valor}</span>}
                {!item.ativo && <Tag texto="inativo" cor="bg-stone-100 text-stone-600"/>}
                <button onClick={()=>alternar(item)} className="px-2 py-1 rounded-lg text-[12.5px] text-stone-600 hover:text-stone-900 hover:bg-stone-100 transition-colors">{item.ativo?"desativar":"ativar"}</button>
                <button onClick={()=>excluir(item)} className="px-2 py-1 rounded-lg text-[12.5px] text-stone-400 hover:text-red-600 hover:bg-red-50 transition-colors">excluir</button>
              </div>))}
          </div>
        </div>
        <div className="text-xs text-stone-400 mt-3">Clique no texto para renomear · as setas mudam a ordem nos menus · desativar esconde sem apagar o histórico.</div>
      </div>
    </div>
    </>}
  </div>);
}

function ConfigEmail(){
  const [cfg,setCfg]=useState(null),[modelos,setModelos]=useState([]),[erro,setErro]=useState(""),[msg,setMsg]=useState("");
  const [salv,setSalv]=useState(false),[test,setTest]=useState(false),[rod,setRod]=useState(false),[editando,setEditando]=useState(null);
  const podeConfig=pode("email.configurar");

function RedefinirSenhaUsuario({usuario, onFechar}){
  const [senha,setSenha]=useState(""),[repete,setRepete]=useState("");
  const [ver,setVer]=useState(true),[erro,setErro]=useState(""),[ocupado,setOcupado]=useState(false);
  const [pronto,setPronto]=useState(false);

  function sortear(){
    const min="abcdefghijkmnopqrstuvwxyz", MAI="ABCDEFGHJKLMNPQRSTUVWXYZ",
          num="23456789", simb="!@#$%&*";
    const todos=min+MAI+num+simb;
    const r=new Uint32Array(14); crypto.getRandomValues(r);
    let p=MAI[r[0]%MAI.length]+num[r[1]%num.length]+simb[r[2]%simb.length];
    for(let i=3;i<14;i++) p+=todos[r[i]%todos.length];
    setSenha(p); setRepete(p); setVer(true); setErro("");
  }
  useEffect(()=>{ sortear(); },[]);

  const forca=(()=>{
    if(senha.length<8) return {n:1, txt:"curta demais", cor:"bg-red-400"};
    let p=1;
    if(/[a-z]/.test(senha)&&/[A-Z]/.test(senha)) p++;
    if(/\d/.test(senha)) p++;
    if(/[^\w]/.test(senha)) p++;
    if(senha.length>=12) p++;
    return [null,{n:1,txt:"fraca",cor:"bg-red-400"},{n:2,txt:"razoável",cor:"bg-amber-400"},
            {n:3,txt:"boa",cor:"bg-emerald-400"},{n:4,txt:"forte",cor:"bg-emerald-500"},
            {n:5,txt:"muito forte",cor:"bg-emerald-600"}][Math.min(p,5)];
  })();

  async function gravar(e){
    e.preventDefault(); setErro("");
    if(senha!==repete){ setErro("As duas senhas não são iguais."); return; }
    setOcupado(true);
    try{
      const r=await sendJSON("/auth/usuarios/"+usuario.id+"/senha","POST",{senha});
      avisar.ok(r.mensagem);
      if(r.aviso) avisar.erro(r.aviso);
      setPronto(true);
    }catch(e){ setErro(e.message); }
    finally{ setOcupado(false); }
  }

  const campo="w-full bg-white text-[14px] text-stone-800 rounded-xl border border-stone-200 "
             +"px-3.5 py-2.5 outline-none transition-all focus:border-[var(--ouro)] focus:ring-[3px] focus:ring-[var(--ouro)]/15";

  if(pronto) return (<Modal titulo={"Senha de "+usuario.nome} onClose={onFechar}>
    <div className="flex items-start gap-3 mb-4">
      <div className="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
        <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor"

function EditorPermissoes({u, cat, onClose, onSalvo}){
  const [perfil,setPerfil]=useState(u.perfil),[marcadas,setMarcadas]=useState(new Set(u.permissoes||[])),[erro,setErro]=useState(""),[salv,setSalv]=useState(false);
  const baseDoPapel=(p)=>new Set(cat.papeis[p]||[]);
  function trocarPapel(p){ setPerfil(p); setMarcadas(baseDoPapel(p)); }
  function toggle(id){ const m=new Set(marcadas); m.has(id)?m.delete(id):m.add(id); setMarcadas(m); }
  async function salvar(){ if(salv) return;
    setErro(""); setSalv(true);
    const base=baseDoPapel(perfil);
    const extra_perms=[...marcadas].filter(x=>!base.has(x)), denied_perms=[...base].filter(x=>!marcadas.has(x));
    try{ await sendJSON("/auth/usuarios/"+u.id,"PATCH",{perfil,extra_perms,denied_perms}); onSalvo(); }catch(e){setErro(e.message);setSalv(false);}
  }
  const base=baseDoPapel(perfil);
  return (<Modal wide titulo={"Permissões — "+u.nome} onClose={onClose}>
    {erro && <div className="mb-3 text-sm text-red-600 bg-red-50 border border-red-200 rounded p-2">{erro}</div>}
    <Campo label="Função (define as permissões padrão)"><Combo value={perfil} onChange={e=>trocarPapel(e.target.value)} options={Object.keys(cat.papeis)} placeholder=""/></Campo>
    <div className="flex items-center gap-4 text-xs mb-2">
      <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> padrão da função</span>
      <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span> concedida à mão</span>
      <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-stone-300 inline-block"></span> sem acesso</span>
    </div>
    <div className="text-xs text-stone-400 mb-2">Trocar a função volta tudo ao padrão dela; depois ajuste item a item.</div>
    <div className="border border-stone-200 rounded-lg max-h-80 overflow-auto">
      {Object.entries(cat.grupos).map(([grupo,ids])=>(
        <div key={grupo}>
          <div className="px-3 py-1.5 bg-stone-100 text-xs font-semibold text-stone-500 uppercase tracking-wide">{grupo}</div>
          <div className="divide-y divide-stone-100">
          {ids.map(id=>{ const label=cat.permissoes[id], onBase=base.has(id), on=marcadas.has(id);
            const cor=onBase?"bg-emerald-500":on?"bg-amber-500":"bg-stone-300";
            return (<label key={id} className="flex items-center gap-3 px-3 py-2 hover:bg-stone-50 cursor-pointer">
              <input type="checkbox" checked={on} onChange={()=>toggle(id)}/>
              <span className={"w-2 h-2 rounded-full inline-block "+cor}></span>
              <span className="flex-1 text-sm text-stone-700">{label}</span></label>);
          })}</div>
        </div>))}
    </div>
    <div className="flex justify-end gap-2 mt-4"><Botao tipo="claro" onClick={onClose}>Cancelar</Botao><Botao onClick={salvar} disabled={salv}>{salv?"Salvando...":"Salvar permissões"}</Botao></div>
  </Modal>);
}
function FormUsuario({onClose,onSalvo}){
  const [d,setD]=useState({nome:"",email:"",senha:"",perfil:"GESTOR"}),[erro,setErro]=useState(""),[salv,setSalv]=useState(false);
  const set=k=>e=>setD({...d,[k]:e.target.value});
  async function salvar(e){ e.preventDefault(); if(salv) return;
    setErro(""); setSalv(true);
    try{ await sendJSON("/auth/usuarios","POST",d); onSalvo(); }catch(err){setErro(err.message);setSalv(false);} }
  return (<Modal titulo="Novo usuário" onClose={onClose}>
    {erro && <div className="mb-3 text-sm text-red-600 bg-red-50 border border-red-200 rounded p-2">{erro}</div>}
    <form onSubmit={salvar}>
      <Campo label="Nome *"><Texto value={d.nome} onChange={set("nome")} required/></Campo>
      <Campo label="E-mail (login) *"><Texto type="email" value={d.email} onChange={set("email")} required/></Campo>
      <Campo label="Senha *"><Texto type="password" value={d.senha} onChange={set("senha")} required/></Campo>
      <Campo label="Função"><Combo value={d.perfil} onChange={set("perfil")} options={PERFIS} placeholder=""/></Campo>
      <div className="text-xs text-stone-400 mb-3">Depois de criar, ajuste as permissões individuais na coluna "permissões".</div>
      <div className="flex justify-end gap-2"><Botao tipo="claro" onClick={onClose}>Cancelar</Botao><Botao submit carregando={salv}>{salv?"Salvando...":"Criar"}</Botao></div>
    </form>
  </Modal>);
}

function Auditoria(){
  const [regs,setRegs]=useState(null),[erro,setErro]=useState(""),[f,setF]=useState({acao:"",entidade:""});
  function carregar(){ const qs=[]; if(f.acao)qs.push("acao="+encodeURIComponent(f.acao)); if(f.entidade)qs.push("entidade="+encodeURIComponent(f.entidade));
    getJSON("/auditoria"+(qs.length?("?"+qs.join("&")):"")).then(setRegs).catch(e=>setErro(e.message)); }
  useEffect(()=>{ carregar(); },[f.acao,f.entidade]);
  if(erro) return <Erro msg={erro}/>; if(!regs) return <Esqueleto linhas={6} tipo="lista"/>;
  const acoes=["login","criar_vaga","editar_vaga","criar_candidato","editar_candidato","criar_usuario","editar_usuario"], ents=["vaga","candidato","usuario"];
  const fmtDH=d=>{ if(!d) return "—"; return new Date(d).toLocaleString("pt-BR"); };
  const resumo=det=>{ if(!det) return "—"; return Object.entries(det).map(([k,v])=>k+"="+(v===null?"—":v)).join(", ").slice(0,80); };
  return (<div>
    <Cabecalho titulo="Auditoria" descricao="Tudo que foi criado ou alterado no sistema, por quem e quando."/>
    <p className="text-sm text-stone-500 mb-4">Quem fez o quê e quando. Os {plural(regs.length,"evento")} mais recentes.</p>
    <div className="surface p-4 mb-4 grid grid-cols-1 md:grid-cols-3 gap-3">
      <Combo value={f.acao} onChange={e=>setF({...f,acao:e.target.value})} options={acoes} placeholder="Ação — todas"/>
      <Combo value={f.entidade} onChange={e=>setF({...f,entidade:e.target.value})} options={ents} placeholder="Tipo — todos"/>
      <button onClick={()=>setF({acao:"",entidade:""})} className="px-2 py-1 rounded-lg text-[12.5px] text-stone-600 hover:text-stone-900 hover:bg-stone-100 transition-colors">Limpar filtros</button>
    </div>
    <div className="surface overflow-hidden aparece"><div className="overflow-x-auto -mx-px">
      <table className="w-full text-sm tabela">
        <thead className="text-stone-400 border-b border-stone-100"><tr>{["Quando","Quem","Ação","Tipo","ID","Detalhes"].map(c=><th key={c} className="text-left px-4 py-2.5 t-rotulo">{c}</th>)}</tr></thead>
        <tbody>
          {regs.length===0 && <tr><td colSpan="6" className="px-4 py-6 text-center text-stone-400">Nenhum evento.</td></tr>}
          {regs.map(r=>(<tr key={r.id} className="border-t border-stone-50 row-hover">
            <td className="px-4 py-2.5 whitespace-nowrap text-stone-500">{fmtDH(r.criado_em)}</td>
            <td className="px-4 py-2.5">{r.ator_nome||"—"}</td>
            <td className="px-4 py-2.5"><Tag texto={r.acao} cor="bg-stone-200 text-stone-700"/></td>
            <td className="px-4 py-2.5">{r.entidade||"—"}</td><td className="px-4 py-2.5">{r.entidade_id||"—"}</td>
            <td className="px-4 py-2.5 text-stone-500">{resumo(r.detalhes)}</td>
          </tr>))}
        </tbody>
      </table>
    </div></div>
  </div>);
}

        vagas={vagasBusca} onClose={()=>setFichaBusca(null)}/>}
      {fichaBusca && fichaBusca.tipo==="vaga" && <AbrirVagaPorId id={fichaBusca.dados.id}
        onClose={()=>setFichaBusca(null)}/>}
    </main>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
